<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img" aria-labelledby="title desc"><title id="title">Three conversations, three different jobs</title><desc id="desc">Moving dots show typed samples and directional request/response traffic. Topic broadcasts to two subscribers; service returns an area; action accepts a goal, gives feedback and a terminal result. Cancellation is an alternative request, not guaranteed acceptance.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#247b84"/></marker></defs><style>@media(prefers-reduced-motion:reduce){.packet{display:none}}</style><rect width="1200" height="1070" fill="#f4f7fa"/><text x="36" y="36" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#247b84">ROS 2 / FOLLOW THE DATA</text><text x="36" y="80" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#17344b">Three conversations, three different jobs</text><rect x="30" y="110" width="1140" height="230" rx="12" fill="#fff" stroke="#c5d4e0"/><text x="52" y="148" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#247b84">TOPIC</text><text x="52" y="182" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17344b">A stream of independent samples</text><rect x="30" y="360" width="1140" height="250" rx="12" fill="#fff" stroke="#c5d4e0"/><text x="52" y="398" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#247b84">SERVICE</text><text x="52" y="432" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17344b">One request and its response</text><rect x="30" y="630" width="1140" height="390" rx="12" fill="#fff" stroke="#c5d4e0"/><text x="52" y="668" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#247b84">ACTION</text><text x="52" y="702" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17344b">A goal with a lifecycle</text><text x="52" y="226" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#17344b">Use: camera frames</text><text x="52" y="258" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#17344b">Options: reliability, history,</text><text x="52" y="283" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#17344b">durability, deadline / QoS</text><text x="52" y="313" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#52677a">No per-sample job result</text><rect x="365" y="158" width="200" height="66" rx="12" fill="#e7f4f3" stroke="#c5d4e0"/><text x="384" y="188" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#17344b">Camera publisher</text><text x="384" y="211" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#17344b">sensor_msgs/Image</text><rect x="912" y="135" width="225" height="65" rx="12" fill="#eaf0fc" stroke="#c5d4e0"/><text x="931" y="174" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#17344b">Viewer subscriber</text><rect x="912" y="248" width="225" height="65" rx="12" fill="#eaf0fc" stroke="#c5d4e0"/><text x="931" y="287" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#17344b">Recorder subscriber</text><text x="600" y="144" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#247b84">/camera/image_raw</text><path d="M565 190H740V168H902" fill="none" stroke="#247b84" stroke-width="3"  marker-end="url(#arrow)"/><path d="M740 190V280H902" fill="none" stroke="#247b84" stroke-width="3"  marker-end="url(#arrow)"/><circle class="packet" r="8" fill="#d56325" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M565 190H740" keyPoints="0;0;1;1" keyTimes="0;0.016666666666666666;0.11666666666666665;1" calcMode="linear"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;1;0;0" keyTimes="0;0.016666666666666666;0.11666666666666665;1" calcMode="discrete"/></circle><circle class="packet" r="8" fill="#d56325" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M740 190V168H902" keyPoints="0;0;1;1" keyTimes="0;0.11666666666666665;0.23333333333333336;1" calcMode="linear"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;1;0;0" keyTimes="0;0.11666666666666665;0.23333333333333336;1" calcMode="discrete"/></circle><circle class="packet" r="8" fill="#d56325" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M740 190V280H902" keyPoints="0;0;1;1" keyTimes="0;0.11666666666666665;0.23333333333333336;1" calcMode="linear"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;1;0;0" keyTimes="0;0.11666666666666665;0.23333333333333336;1" calcMode="discrete"/></circle><circle class="packet" r="8" fill="#d56325" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M565 190H740" keyPoints="0;0;1;1" keyTimes="0;0.35000000000000003;0.45;1" calcMode="linear"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;1;0;0" keyTimes="0;0.35000000000000003;0.45;1" calcMode="discrete"/></circle><circle class="packet" r="8" fill="#d56325" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M740 190V168H902" keyPoints="0;0;1;1" keyTimes="0;0.45;0.5666666666666668;1" calcMode="linear"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;1;0;0" keyTimes="0;0.45;0.5666666666666668;1" calcMode="discrete"/></circle><circle class="packet" r="8" fill="#d56325" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M740 190V280H902" keyPoints="0;0;1;1" keyTimes="0;0.45;0.5666666666666668;1" calcMode="linear"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;1;0;0" keyTimes="0;0.45;0.5666666666666668;1" calcMode="discrete"/></circle><circle class="packet" r="8" fill="#d56325" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M565 190H740" keyPoints="0;0;1;1" keyTimes="0;0.6833333333333332;0.7833333333333332;1" calcMode="linear"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;1;0;0" keyTimes="0;0.6833333333333332;0.7833333333333332;1" calcMode="discrete"/></circle><circle class="packet" r="8" fill="#d56325" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M740 190V168H902" keyPoints="0;0;1;1" keyTimes="0;0.7833333333333332;0.8999999999999999;1" calcMode="linear"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;1;0;0" keyTimes="0;0.7833333333333332;0.8999999999999999;1" calcMode="discrete"/></circle><circle class="packet" r="8" fill="#d56325" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M740 190V280H902" keyPoints="0;0;1;1" keyTimes="0;0.7833333333333332;0.8999999999999999;1" calcMode="linear"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;1;0;0" keyTimes="0;0.7833333333333332;0.8999999999999999;1" calcMode="discrete"/></circle><text x="52" y="476" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#17344b">Use: compute an area</text><text x="52" y="508" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#17344b">Options: typed request</text><text x="52" y="533" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#17344b">and response; async client</text><text x="52" y="567" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#52677a">No built-in progress/cancel</text><rect x="365" y="407" width="195" height="157" rx="12" fill="#e7f4f3" stroke="#c5d4e0"/><text x="387" y="444" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#17344b">Service client</text><text x="387" y="479" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17344b">width = 3</text><text x="387" y="508" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17344b">height = 4</text><rect x="930" y="407" width="207" height="157" rx="12" fill="#eaf0fc" stroke="#c5d4e0"/><text x="950" y="444" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#17344b">Area server</text><text x="950" y="479" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17344b">3 × 4 = 12</text><text x="950" y="516" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#17344b">brief operation</text><path d="M565 458H920" fill="none" stroke="#247b84" stroke-width="3"  marker-end="url(#arrow)"/><text x="617" y="439" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#17344b">1  Request: 3, 4</text><path d="M920 536H565" fill="none" stroke="#247b84" stroke-width="3"  marker-end="url(#arrow)"/><text x="617" y="516" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#17344b">2  Response: 12</text><circle class="packet" r="8" fill="#d56325" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M565 458H920" keyPoints="0;0;1;1" keyTimes="0;0.016666666666666666;0.25;1" calcMode="linear"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;1;0;0" keyTimes="0;0.016666666666666666;0.25;1" calcMode="discrete"/></circle><circle class="packet" r="8" fill="#d56325" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M920 536H565" keyPoints="0;0;1;1" keyTimes="0;0.3333333333333333;0.5833333333333334;1" calcMode="linear"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;1;0;0" keyTimes="0;0.3333333333333333;0.5833333333333334;1" calcMode="discrete"/></circle><text x="52" y="751" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#17344b">Use: drive to a waypoint</text><text x="52" y="790" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#17344b">Options: goal acceptance,</text><text x="52" y="816" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#17344b">feedback, status, result,</text><text x="52" y="842" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#17344b">cancellation request</text><text x="52" y="904" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#52677a">Cancel can be rejected;</text><text x="52" y="930" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#52677a">it is not an emergency stop.</text><text x="52" y="978" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#52677a">Dashed path = alternative.</text><rect x="365" y="680" width="195" height="295" rx="12" fill="#e7f4f3" stroke="#c5d4e0"/><text x="385" y="718" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#17344b">Action client</text><rect x="930" y="680" width="207" height="295" rx="12" fill="#eaf0fc" stroke="#c5d4e0"/><text x="950" y="718" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#17344b">Action server</text><path d="M565 755H920" fill="none" stroke="#247b84" stroke-width="3"  marker-end="url(#arrow)"/><text x="586" y="743" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#17344b">1  Goal: go to pose</text><circle class="packet" r="8" fill="#d56325" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M565 755H920" keyPoints="0;0;1;1" keyTimes="0;0.016666666666666666;0.16666666666666666;1" calcMode="linear"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;1;0;0" keyTimes="0;0.016666666666666666;0.16666666666666666;1" calcMode="discrete"/></circle><path d="M920 807H565" fill="none" stroke="#247b84" stroke-width="3"  marker-end="url(#arrow)"/><text x="586" y="795" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#17344b">2  Accepted</text><circle class="packet" r="8" fill="#d56325" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M920 807H565" keyPoints="0;0;1;1" keyTimes="0;0.18333333333333335;0.30833333333333335;1" calcMode="linear"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;1;0;0" keyTimes="0;0.18333333333333335;0.30833333333333335;1" calcMode="discrete"/></circle><path d="M920 859H565" fill="none" stroke="#247b84" stroke-width="3"  marker-end="url(#arrow)"/><text x="586" y="847" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#17344b">3  Feedback: distance left</text><circle class="packet" r="8" fill="#d56325" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M920 859H565" keyPoints="0;0;1;1" keyTimes="0;0.3333333333333333;0.5;1" calcMode="linear"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;1;0;0" keyTimes="0;0.3333333333333333;0.5;1" calcMode="discrete"/></circle><path d="M920 911H565" fill="none" stroke="#247b84" stroke-width="3"  marker-end="url(#arrow)"/><text x="586" y="899" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#17344b">4  Result + final status</text><circle class="packet" r="8" fill="#d56325" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M920 911H565" keyPoints="0;0;1;1" keyTimes="0;0.5833333333333334;0.75;1" calcMode="linear"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;1;0;0" keyTimes="0;0.5833333333333334;0.75;1" calcMode="discrete"/></circle><path d="M565 990H920" fill="none" stroke="#247b84" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="594" y="979" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#17344b">Optional: cancel this goal</text><text x="36" y="1046" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#52677a">Illustrative timing • original course diagram • CC BY 4.0 • static labels remain readable when paused</text></svg>