<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
<title id="title">Shared interfaces reduce custom glue</title><desc id="desc">Custom links between a camera, detector, planner and controller are compared with interchangeable image sources feeding one ROS topic and independent RViz, rosbag2 and vision subscribers.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#235c4b"/></marker></defs>
<g font-family="Inter, Segoe UI, Arial, sans-serif"><rect width="1200" height="880" fill="#f6f5f0"/>
<text x="48" y="43" fill="#b96d3f" font-size="16" font-weight="700" text-anchor="start">NODES TO MAPS  /  ROS 2 FOUNDATIONS</text>
<text x="48" y="102" fill="#1b3634" font-size="43" font-weight="700" text-anchor="start">Shared interfaces reduce custom glue</text>
<text x="48" y="140" fill="#6a7771" font-size="23" font-weight="400" text-anchor="start">Agree on the interface once. Connect independent consumers.</text><rect x="48" y="170" width="1104" height="202" rx="16" fill="#fffefa" stroke="#dce1d7" stroke-width="2"/><text x="72" y="204" fill="#b96d3f" font-size="17" font-weight="700" text-anchor="start">CUSTOM CONNECTIONS</text><rect x="72" y="225" width="240" height="96" rx="16" fill="#fffefa" stroke="#dce1d7" stroke-width="2"/><text x="94" y="262" fill="#1b3634" font-size="25" font-weight="700" text-anchor="start">Camera</text><text x="94" y="298" fill="#6a7771" font-size="21" font-weight="400" text-anchor="start">pixels</text><rect x="344" y="225" width="240" height="96" rx="16" fill="#fffefa" stroke="#dce1d7" stroke-width="2"/><text x="366" y="262" fill="#1b3634" font-size="25" font-weight="700" text-anchor="start">Detector</text><text x="366" y="298" fill="#6a7771" font-size="21" font-weight="400" text-anchor="start">objects</text><rect x="616" y="225" width="240" height="96" rx="16" fill="#fffefa" stroke="#dce1d7" stroke-width="2"/><text x="638" y="262" fill="#1b3634" font-size="25" font-weight="700" text-anchor="start">Planner</text><text x="638" y="298" fill="#6a7771" font-size="21" font-weight="400" text-anchor="start">path</text><rect x="888" y="225" width="240" height="96" rx="16" fill="#fffefa" stroke="#dce1d7" stroke-width="2"/><text x="910" y="262" fill="#1b3634" font-size="25" font-weight="700" text-anchor="start">Controller</text><text x="910" y="298" fill="#6a7771" font-size="21" font-weight="400" text-anchor="start">wheel commands</text><path d="M315 273H340" fill="none" stroke="#b96d3f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M587 273H612" fill="none" stroke="#b96d3f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M859 273H884" fill="none" stroke="#b96d3f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="350" fill="#6a7771" font-size="22" font-weight="400" text-anchor="start">Every boundary needs agreement on formats, units, timing and configuration.</text><rect x="48" y="398" width="1104" height="370" rx="16" fill="#eaf0e5" stroke="#dce1d7" stroke-width="2"/><text x="72" y="436" fill="#235c4b" font-size="17" font-weight="700" text-anchor="start">SHARED ROS INTERFACES</text><rect x="72" y="466" width="214" height="82" rx="16" fill="#fffefa" stroke="#dce1d7" stroke-width="2"/><text x="94" y="503" fill="#1b3634" font-size="25" font-weight="700" text-anchor="start">Real camera</text><text x="94" y="525" fill="#6a7771" font-size="21" font-weight="400" text-anchor="start">driver</text><path d="M286 507H328V599H366" fill="none" stroke="#235c4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="72" y="558" width="214" height="82" rx="16" fill="#fffefa" stroke="#dce1d7" stroke-width="2"/><text x="94" y="595" fill="#1b3634" font-size="25" font-weight="700" text-anchor="start">Simulation</text><text x="94" y="617" fill="#6a7771" font-size="21" font-weight="400" text-anchor="start">sensor model</text><path d="M286 599H328V599H366" fill="none" stroke="#235c4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="72" y="650" width="214" height="82" rx="16" fill="#fffefa" stroke="#dce1d7" stroke-width="2"/><text x="94" y="687" fill="#1b3634" font-size="25" font-weight="700" text-anchor="start">Recorded bag</text><text x="94" y="709" fill="#6a7771" font-size="21" font-weight="400" text-anchor="start">replay</text><path d="M286 691H328V599H366" fill="none" stroke="#235c4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="366" y="510" width="386" height="178" rx="16" fill="#235c4b" stroke="#235c4b" stroke-width="2"/><text x="559" y="553" fill="#d4edab" font-size="18" font-weight="700" text-anchor="middle">ONE TYPED STREAM</text><text x="559" y="596" fill="#fffefa" font-size="28" font-weight="700" text-anchor="middle">/camera/image_raw</text><text x="559" y="637" fill="#fffefa" font-size="24" font-weight="400" text-anchor="middle">sensor_msgs/msg/Image</text><path d="M752 599H793V507H834" fill="none" stroke="#235c4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="834" y="466" width="294" height="82" rx="16" fill="#fffefa" stroke="#dce1d7" stroke-width="2"/><text x="856" y="503" fill="#1b3634" font-size="25" font-weight="700" text-anchor="start">RViz</text><text x="856" y="525" fill="#6a7771" font-size="21" font-weight="400" text-anchor="start">view images</text><path d="M752 599H793V599H834" fill="none" stroke="#235c4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="834" y="558" width="294" height="82" rx="16" fill="#fffefa" stroke="#dce1d7" stroke-width="2"/><text x="856" y="595" fill="#1b3634" font-size="25" font-weight="700" text-anchor="start">rosbag2</text><text x="856" y="617" fill="#6a7771" font-size="21" font-weight="400" text-anchor="start">record images</text><path d="M752 599H793V691H834" fill="none" stroke="#235c4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="834" y="650" width="294" height="82" rx="16" fill="#fffefa" stroke="#dce1d7" stroke-width="2"/><text x="856" y="687" fill="#1b3634" font-size="25" font-weight="700" text-anchor="start">Vision node</text><text x="856" y="709" fill="#6a7771" font-size="21" font-weight="400" text-anchor="start">process images</text><text x="48" y="810" fill="#235c4b" font-size="23" font-weight="600" text-anchor="start">Choose a source; reuse consumers. Match encoding, timestamps, calibration and QoS.</text>
<path d="M48 833H1152" fill="none" stroke="#dce1d7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="48" y="861" fill="#6a7771" font-size="14" font-weight="400" text-anchor="start">CONCEPT DIAGRAM · CC BY 4.0 · NODES TO MAPS</text>
</g></svg>