<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Three ways to reopen the same Ubuntu</title><desc id="desc">Use the exact distro name shown by wsl -l -v. No reinstall is needed.. Illustrative simulation, not an actual software run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#4b7764"/></marker></defs><rect width="1000" height="640" fill="#f6f3e9"/><text x="34" y="38" font-size="15" fill="#8d4f31" font-family="Arial, sans-serif">VISUAL CHECKPOINT · SIMULATED EXAMPLE</text><text x="34" y="82" font-size="30" fill="#213e34" font-family="Arial, sans-serif">Three ways to reopen the same Ubuntu</text><rect x="34" y="116" width="932" height="110" rx="12" fill="#18332b" stroke="#cbd5c8"/><text x="54" y="148" font-size="19" fill="#b9cbbb" font-family="Arial, sans-serif">1 · PowerShell / Windows Terminal</text><text x="54" y="191" font-size="26" fill="#eef3e9" font-family="monospace">PS&gt; wsl -d Ubuntu-24.04</text><rect x="34" y="245" width="448" height="276" rx="12" fill="#eaf4f8" stroke="#cbd5c8"/><text x="56" y="282" font-size="23" fill="#213e34" font-family="Arial, sans-serif">2 · Windows Start menu</text><rect x="56" y="303" width="404" height="51" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="72" y="335" font-size="21" fill="#213e34" font-family="Arial, sans-serif">Search: Ubuntu 24.04 LTS</text><rect x="56" y="372" width="404" height="109" rx="12" fill="#fff4df" stroke="#cbd5c8"/><text x="76" y="411" font-size="24" fill="#213e34" font-family="Arial, sans-serif">Ubuntu 24.04 LTS</text><text x="76" y="450" font-size="21" fill="#213e34" font-family="Arial, sans-serif">App → Open</text><rect x="500" y="245" width="466" height="276" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="522" y="282" font-size="23" fill="#213e34" font-family="Arial, sans-serif">3 · Windows Terminal</text><text x="522" y="331" font-size="25" fill="#213e34" font-family="Arial, sans-serif">Ubuntu tab     +     ▾</text><rect x="522" y="354" width="420" height="126" rx="12" fill="#eaf4f8" stroke="#cbd5c8"/><text x="544" y="390" font-size="21" fill="#213e34" font-family="Arial, sans-serif">PowerShell</text><text x="544" y="424" font-size="21" fill="#213e34" font-family="Arial, sans-serif">Command Prompt</text><text x="544" y="458" font-size="21" fill="#213e34" font-family="Arial, sans-serif">Ubuntu-24.04  ← choose this</text><text x="34" y="596" font-size="17" fill="#213e34" font-family="Arial, sans-serif">Use the exact distro name shown by wsl -l -v. No reinstall is needed.</text><text x="34" y="622" font-size="14" fill="#65766b" font-family="Arial, sans-serif">Illustrative values and layout. Compare concepts; your software may look different.</text></svg>