<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Enable the catalogues before installing ROS</title><desc id="desc">The lesson includes the download commands between Universe and dpkg.. Illustrative simulation, not an actual software run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#4b7764"/></marker></defs><rect width="1000" height="640" fill="#f6f3e9"/><text x="34" y="38" font-size="15" fill="#8d4f31" font-family="Arial, sans-serif">VISUAL CHECKPOINT · SIMULATED EXAMPLE</text><text x="34" y="82" font-size="30" fill="#213e34" font-family="Arial, sans-serif">Enable the catalogues before installing ROS</text><rect x="34" y="108" width="932" height="449" rx="12" fill="#18332b" stroke="#18332b"/><text x="58" y="143" font-size="16" fill="#b9cbbb" font-family="Arial, sans-serif">Ubuntu · Bash — simulated screen</text><text x="58" y="184" font-size="17" fill="#b9d78f" font-family="monospace">$ sudo add-apt-repository -y universe</text><text x="58" y="214" font-size="17" fill="#eef3e9" font-family="monospace">Adding component(s) &#39;universe&#39; to all repositories.</text><text x="58" y="244" font-size="17" fill="#eef3e9" font-family="monospace"></text><text x="58" y="274" font-size="17" fill="#b9d78f" font-family="monospace">$ sudo dpkg -i /tmp/ros2-apt-source.deb</text><text x="58" y="304" font-size="17" fill="#eef3e9" font-family="monospace">Setting up ros2-apt-source (...) ...</text><text x="58" y="334" font-size="17" fill="#eef3e9" font-family="monospace"></text><text x="58" y="364" font-size="17" fill="#b9d78f" font-family="monospace">$ sudo apt update</text><text x="58" y="394" font-size="17" fill="#eef3e9" font-family="monospace">... Ubuntu package indexes ...</text><text x="58" y="424" font-size="17" fill="#eef3e9" font-family="monospace">Get: ... packages.ros.org/ros2/ubuntu noble InRelease</text><text x="58" y="454" font-size="17" fill="#eef3e9" font-family="monospace">Reading package lists... Done</text><text x="58" y="484" font-size="17" fill="#eef3e9" font-family="monospace">Continue only after repository setup succeeds.</text><text x="34" y="596" font-size="17" fill="#213e34" font-family="Arial, sans-serif">The lesson includes the download commands between Universe and dpkg.</text><text x="34" y="622" font-size="14" fill="#65766b" font-family="Arial, sans-serif">Illustrative values and layout. Compare concepts; your software may look different.</text></svg>