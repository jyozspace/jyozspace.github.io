<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Where each part of your project runs</title><desc id="desc">The IMU component topics are available for inspection and future sensor-fusion projects.. Illustrative simulation, not an actual software run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#4b7764"/></marker></defs><rect width="1000" height="640" fill="#f6f3e9"/><text x="34" y="38" font-size="15" fill="#8d4f31" font-family="Arial, sans-serif">VISUAL CHECKPOINT · SIMULATED EXAMPLE</text><text x="34" y="82" font-size="30" fill="#213e34" font-family="Arial, sans-serif">Where each part of your project runs</text><text x="45" y="132" font-size="17" fill="#8d4f31" font-family="Arial, sans-serif">PHONE</text><rect x="40" y="155" width="270" height="94" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="58" y="191" font-size="22" fill="#213e34" font-family="Arial, sans-serif">Android APK</text><text x="58" y="223" font-size="16" fill="#557064" font-family="Arial, sans-serif">Camera2 + sensor events</text><path d="M320 204L416 204" stroke="#4b7764" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="331" y="183" font-size="18" fill="#213e34" font-family="Arial, sans-serif">WSS</text><text x="445" y="132" font-size="17" fill="#8d4f31" font-family="Arial, sans-serif">LAPTOP · UBUNTU + ROS 2 JAZZY</text><rect x="432" y="155" width="525" height="94" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="450" y="191" font-size="22" fill="#213e34" font-family="Arial, sans-serif">phone_bridge</text><text x="450" y="223" font-size="16" fill="#557064" font-family="Arial, sans-serif">Pair → validate → stamp → decode → publish</text><path d="M687 254L687 310" stroke="#4b7764" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="432" y="322" width="525" height="94" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="450" y="358" font-size="22" fill="#213e34" font-family="Arial, sans-serif">ROS image + CameraInfo + native IMU</text><text x="450" y="390" font-size="16" fill="#557064" font-family="Arial, sans-serif">Inspect with CLI, image_view and rosbag2</text><path d="M687 422L687 467" stroke="#4b7764" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="432" y="478" width="525" height="94" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="450" y="514" font-size="22" fill="#213e34" font-family="Arial, sans-serif">Optional monocular SLAM</text><text x="450" y="546" font-size="16" fill="#557064" font-family="Arial, sans-serif">Calibrated images → ORB-SLAM3 viewer</text><text x="44" y="357" font-size="20" fill="#213e34" font-family="Arial, sans-serif">The app runs on the phone.</text><text x="44" y="399" font-size="20" fill="#213e34" font-family="Arial, sans-serif">ROS runs on the laptop.</text><text x="44" y="441" font-size="18" fill="#213e34" font-family="Arial, sans-serif">The provided mapper uses</text><text x="44" y="470" font-size="18" fill="#213e34" font-family="Arial, sans-serif">the camera stream.</text><text x="34" y="596" font-size="17" fill="#213e34" font-family="Arial, sans-serif">The IMU component topics are available for inspection and future sensor-fusion projects.</text><text x="34" y="622" font-size="14" fill="#65766b" font-family="Arial, sans-serif">Illustrative values and layout. Compare concepts; your software may look different.</text></svg>