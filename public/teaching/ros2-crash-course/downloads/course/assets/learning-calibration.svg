<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc"><title id="title">Squares are not the same as inner corners</title><desc id="desc">An exact nine by seven checkerboard marks its eight by six interior intersections. Three schematic target poses illustrate collecting varied position, size and tilt.</desc><rect width="1200" height="760" fill="#f5f7fa"/><text x="44" y="40" fill="#52647b" font-family="Arial, sans-serif" font-size="15" font-weight="700">NODES TO MAPS / CONCEPT EXPLAINER</text><text x="44" y="88" fill="#182c45" font-family="Arial, sans-serif" font-size="34" font-weight="700">Squares are not the same as inner corners</text><text x="44" y="136" fill="#52647b" font-family="Arial, sans-serif" font-size="22" font-weight="400">Count the intersections inside the board, and measure a square on the final print.</text><rect x="44" y="166" width="550" height="501" rx="12" fill="#fff" stroke="#cbd4df" stroke-width="2"/><rect x="620" y="166" width="536" height="501" rx="12" fill="#fff" stroke="#cbd4df" stroke-width="2"/><text x="68" y="207" fill="#182c45" font-family="Arial, sans-serif" font-size="25" font-weight="700">9 × 7 squares</text><rect x="88" y="240" width="48" height="48" fill="#25364b"/><rect x="136" y="240" width="48" height="48" fill="#fff"/><rect x="184" y="240" width="48" height="48" fill="#25364b"/><rect x="232" y="240" width="48" height="48" fill="#fff"/><rect x="280" y="240" width="48" height="48" fill="#25364b"/><rect x="328" y="240" width="48" height="48" fill="#fff"/><rect x="376" y="240" width="48" height="48" fill="#25364b"/><rect x="424" y="240" width="48" height="48" fill="#fff"/><rect x="472" y="240" width="48" height="48" fill="#25364b"/><rect x="88" y="288" width="48" height="48" fill="#fff"/><rect x="136" y="288" width="48" height="48" fill="#25364b"/><rect x="184" y="288" width="48" height="48" fill="#fff"/><rect x="232" y="288" width="48" height="48" fill="#25