ont-family="Arial, sans-serif" font-size="27" font-weight="700">1</text><text x="868" y="414" fill="#2769ad" font-family="Arial, sans-serif" font-size="27" font-weight="700">2</text><text x="1040" y="371" fill="#2769ad" font-family="Arial, sans-serif" font-size="27" font-weight="700">3</text><text x="646" y="563" fill="#182c45" font-family="Arial, sans-serif" font-size="21" font-weight="400">Change position, apparent size and tilt.</text><text x="646" y="601" fill="#182c45" font-family="Arial, sans-serif" font-size="20" font-weight="400">Keep each captured board sharp and visible.</text><text x="44" y="709" fill="#52647b" font-family="Arial, sans-serif" font-size="19" font-weight="400">These are target poses, not an imitation of the calibration application. Use your measured square size.</text><text x="44" y="735" fill="#52647b" font-family="Arial, sans-serif" font-size="15" font-weight="400">Original course diagram • schematic, not measured output • CC BY 4.0</text></svg>