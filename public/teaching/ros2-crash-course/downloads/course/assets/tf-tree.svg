<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Frames have geometry and an owner</title><desc id="desc">The mobile-robot tree is a separate metric example; the phone world has arbitrary scale.. Illustrative simulation, not an actual software run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#4b7764"/></marker></defs><rect width="1000" height="640" fill="#f6f3e9"/><text x="34" y="38" font-size="15" fill="#8d4f31" font-family="Arial, sans-serif">VISUAL CHECKPOINT · SIMULATED EXAMPLE</text><text x="34" y="82" font-size="30" fill="#213e34" font-family="Arial, sans-serif">Frames have geometry and an owner</text><rect x="40" y="130" width="250" height="94" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="58" y="166" font-size="22" fill="#213e34" font-family="Arial, sans-serif">map → odom</text><text x="58" y="198" font-size="16" fill="#557064" font-family="Arial, sans-serif">Global localization / SLAM</text><rect x="374" y="130" width="250" height="94" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="392" y="166" font-size="22" fill="#213e34" font-family="Arial, sans-serif">odom → base_link</text><text x="392" y="198" font-size="16" fill="#557064" font-family="Arial, sans-serif">Local motion estimator</text><rect x="710" y="130" width="250" height="94" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="728" y="166" font-size="22" fill="#213e34" font-family="Arial, sans-serif">base_link → sensor</text><text x="728" y="198" font-size="16" fill="#557064" font-family="Arial, sans-serif">Measured rigid mounting</text><path d="M296 178L367 178" stroke="#4b7764" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M631 178L703 178" stroke="#4b7764" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="50" y="306" font-size="26" fill="#213e34" font-family="Arial, sans-serif">Worked example: demo_sensor → demo_base</text><text x="50" y="352" font-size="22" fill="#213e34" font-family="Arial, sans-serif">Sensor point (1, 0, 0)   •   yaw +90°   •   translation (0.1, 0, 0.2)</text><path d="M120 500L290 500" stroke="#4b7764" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M120 500L120 382" stroke="#4b7764" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="300" y="505" font-size="18" fill="#213e34" font-family="Arial, sans-serif">base x</text><text x="65" y="373" font-size="18" fill="#213e34" font-family="Arial, sans-serif">base y</text><circle cx="137" cy="396" r="8" fill="#b56f43"/><text x="360" y="433" font-size="24" fill="#213e34" font-family="Arial, sans-serif">Rotate: (0, 1, 0)</text><text x="360" y="479" font-size="24" fill="#213e34" font-family="Arial, sans-serif">Translate: (0.1, 1.0, 0.2) m</text><text x="360" y="525" font-size="18" fill="#213e34" font-family="Arial, sans-serif">Coordinates change; a new label alone is insufficient.</text><text x="34" y="596" font-size="17" fill="#213e34" font-family="Arial, sans-serif">The mobile-robot tree is a separate metric example; the phone world has arbitrary scale.</text><text x="34" y="622" font-size="14" fill="#65766b" font-family="Arial, sans-serif">Illustrative values and layout. Compare concepts; your software may look different.</text></svg>