<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">A successful first build</title><desc id="desc">Look for four finished packages, then check that your executables are discoverable.. Illustrative simulation, not an actual software run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#4b7764"/></marker></defs><rect width="1000" height="640" fill="#f6f3e9"/><text x="34" y="38" font-size="15" fill="#8d4f31" font-family="Arial, sans-serif">VISUAL CHECKPOINT · SIMULATED EXAMPLE</text><text x="34" y="82" font-size="30" fill="#213e34" font-family="Arial, sans-serif">A successful first build</text><rect x="34" y="108" width="932" height="449" rx="12" fill="#18332b" stroke="#18332b"/><text x="58" y="143" font-size="16" fill="#b9cbbb" font-family="Arial, sans-serif">Ubuntu · Bash — illustrative terminal output</text><text x="58" y="184" font-size="18" fill="#b9d78f" font-family="monospace">$ echo $ROS_DISTRO</text><text x="58" y="215" font-size="18" fill="#eef3e9" font-family="monospace">jazzy</text><text x="58" y="246" font-size="18" fill="#b9d78f" font-family="monospace">$ lsb_release -cs</text><text x="58" y="277" font-size="18" fill="#eef3e9" font-family="monospace">noble</text><text x="58" y="308" font-size="18" fill="#b9d78f" font-family="monospace">$ colcon build --symlink-install</text><text x="58" y="339" font-size="18" fill="#eef3e9" font-family="monospace">Summary: 4 packages finished [example duration]</text><text x="58" y="370" font-size="18" fill="#b9d78f" font-family="monospace">$ source install/setup.bash</text><text x="58" y="401" font-size="18" fill="#b9d78f" font-family="monospace">$ ros2 pkg executables ros2_course_py</text><text x="58" y="432" font-size="18" fill="#eef3e9" font-family="monospace">ros2_course_py talker</text><text x="58" y="463" font-size="18" fill="#eef3e9" font-family="monospace">ros2_course_py listener</text><text x="58" y="494" font-size="18" fill="#eef3e9" font-family="monospace">ros2_course_py phone_bridge</text><text x="34" y="596" font-size="17" fill="#213e34" font-family="Arial, sans-serif">Look for four finished packages, then check that your executables are discoverable.</text><text x="34" y="622" font-size="14" fill="#65766b" font-family="Arial, sans-serif">Illustrative values and layout. Compare concepts; your software may look different.</text></svg>