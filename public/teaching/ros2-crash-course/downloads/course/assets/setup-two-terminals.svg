<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Two Ubuntu terminals, one conversation</title><desc id="desc">Leave A running while B starts. New Bash tabs load the saved .bashrc settings.. Illustrative simulation, not an actual software run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#4b7764"/></marker></defs><rect width="1000" height="640" fill="#f6f3e9"/><text x="34" y="38" font-size="15" fill="#8d4f31" font-family="Arial, sans-serif">VISUAL CHECKPOINT · SIMULATED EXAMPLE</text><text x="34" y="82" font-size="30" fill="#213e34" font-family="Arial, sans-serif">Two Ubuntu terminals, one conversation</text><rect x="34" y="116" width="456" height="404" rx="12" fill="#18332b" stroke="#cbd5c8"/><text x="51" y="152" font-size="18" fill="#b9cbbb" font-family="Arial, sans-serif">Terminal A · NEW Ubuntu tab</text><text x="51" y="202" font-size="14" fill="#b9d78f" font-family="monospace">$ ros2 run demo_nodes_cpp talker</text><text x="51" y="263" font-size="17" fill="#eef3e9" font-family="monospace">Publishing: &#39;Hello World: 1&#39;</text><text x="51" y="310" font-size="17" fill="#eef3e9" font-family="monospace">Publishing: &#39;Hello World: 2&#39;</text><text x="51" y="357" font-size="17" fill="#eef3e9" font-family="monospace">Publishing: &#39;Hello World: 3&#39;</text><text x="51" y="404" font-size="17" fill="#eef3e9" font-family="monospace">Publishing: &#39;Hello World: 4&#39;</text><text x="51" y="482" font-size="17" fill="#b9cbbb" font-family="Arial, sans-serif">Ctrl+C stops this node.</text><rect x="510" y="116" width="456" height="404" rx="12" fill="#18332b" stroke="#cbd5c8"/><text x="527" y="152" font-size="18" fill="#b9cbbb" font-family="Arial, sans-serif">Terminal B · ANOTHER Ubuntu tab</text><text x="527" y="202" font-size="14" fill="#b9d78f" font-family="monospace">$ ros2 run demo_nodes_py listener</text><text x="527" y="263" font-size="17" fill="#eef3e9" font-family="monospace">I heard: &#39;Hello World: 1&#39;</text><text x="527" y="310" font-size="17" fill="#eef3e9" font-family="monospace">I heard: &#39;Hello World: 2&#39;</text><text x="527" y="357" font-size="17" fill="#eef3e9" font-family="monospace">I heard: &#39;Hello World: 3&#39;</text><text x="527" y="404" font-size="17" fill="#eef3e9" font-family="monospace">I heard: &#39;Hello World: 4&#39;</text><text x="527" y="482" font-size="17" fill="#b9cbbb" font-family="Arial, sans-serif">Ctrl+C stops this node.</text><text x="34" y="596" font-size="17" fill="#213e34" font-family="Arial, sans-serif">Leave A running while B starts. New Bash tabs load the saved .bashrc settings.</text><text x="34" y="622" font-size="14" fill="#65766b" font-family="Arial, sans-serif">Illustrative values and layout. Compare concepts; your software may look different.</text></svg>