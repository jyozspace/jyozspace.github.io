"Arial, sans-serif" font-size="19" font-weight="400">request</text><path d="M712 469 L482 469" fill="none" stroke="#237969" stroke-width="3" /><path d="M-10 -5L0 0L-10 5" transform="translate(482 469) rotate(180)" fill="none" stroke="#237969" stroke-width="3"/><text x="517" y="450" fill="#237969" font-family="Arial, sans-serif" font-size="19" font-weight="400">response</text><text x="510" y="557" fill="#52647b" font-family="Arial, sans-serif" font-size="20" font-weight="400">One answer</text><path d="M860 302 L1090 302" fill="none" stroke="#2769ad" stroke-width="3" /><path d="M-10 -5L0 0L-10 5" transform="translate(1090 302) rotate(0)" fill="none" stroke="#2769ad" stroke-width="3"/><text x="891" y="288" fill="#2769ad" font-family="Arial, sans-serif" font-size="18" font-weight="400">goal</text><path d="M1090 365 L860 365" fill="none" stroke="#237969" stroke-width="3" /><path d="M-10 -5L0 0L-10 5" transform="translate(860 365) rotate(180)" fill="none" stroke="#237969" stroke-width="3"/><text x="891" y="351" fill="#237969" font-family="Arial, sans-serif" font-size="18" font-weight="400">accepted</text><path d="M1090 428 L860 428" fill="none" stroke="#bd632b" stroke-width="3" /><path d="M-10 -5L0 0L-10 5" transform="translate(860 428) rotate(180)" fill="none" stroke="#bd632b" stroke-width="3"/><text x="891" y="414" fill="#bd632b" font-family="Arial, sans-serif" font-size="18" font-weight="400">feedback</text><path d="M1090 492 L860 492" fill="none" stroke="#bd632b" stroke-width="3" /><path d="M-10 -5L0 0L-10 5" transform="translate(860 492) rotate(180)" fill="none" stroke="#bd632b" stroke-width="3"/><text x="891" y="478" fill="#bd632b" font-family="Arial, sans-serif" font-size="18" font-weight="400">feedback</text><path d="M1090 584 L860 584" fill="none" stroke="#237969" stroke-width="3" /><path d="M-10 -5L0 0L-10 5" transform="translate(860 584) rotate(180)" fill="none" stroke="#237969" stroke-width="3"/><text x="891" y="570" fill="#237969" font-family="Arial, sans-serif" font-size="18" font-weight="400">result + status</text><text x="44" y="703" fill="#52647b" font-family="Arial, sans-serif" font-size="21" font-weight="400">An action may also receive a cancellation request; the server must act on it.</text><text x="44" y="735" fill="#52647b" font-family="Arial, sans-serif" font-size="15" font-weight="400">Original course diagram • schematic, not measured output • CC BY 4.0</text></svg>