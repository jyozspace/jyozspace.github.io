<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc"><title id="title">Choose the shape of the conversation</title><desc id="desc">Three sequence diagrams compare continuous topic samples, a service request with one response, and action goal acceptance, feedback, result and status.</desc><rect width="1200" height="760" fill="#f5f7fa"/><text x="44" y="40" fill="#52647b" font-family="Arial, sans-serif" font-size="15" font-weight="700">NODES TO MAPS / CONCEPT EXPLAINER</text><text x="44" y="88" fill="#182c45" font-family="Arial, sans-serif" font-size="34" font-weight="700">Choose the shape of the conversation</text><text x="44" y="134" fill="#52647b" font-family="Arial, sans-serif" font-size="22" font-weight="400">Time runs downward. Each arrow shows information moving between participants.</text><rect x="44" y="166" width="356" height="492" rx="12" fill="#fff" stroke="#cbd4df" stroke-width="2"/><text x="64" y="206" fill="#182c45" font-family="Arial, sans-serif" font-size="23" font-weight="700">TOPIC</text><text x="68" y="247" fill="#52647b" font-family="Arial, sans-serif" font-size="20" font-weight="400">Publisher</text><text x="265" y="247" fill="#52647b" font-family="Arial, sans-serif" font-size="20" font-weight="400">Subscriber</text><path d="M104 269 L104 620" fill="none" stroke="#cbd4df" stroke-width="3" stroke-dasharray="7 7"/><path d="M334 269 L334 620" fill="none" stroke="#cbd4df" stroke-width="3" stroke-dasharray="7 7"/><rect x="422" y="166" width="356" height="492" rx="12" fill="#fff" stroke="#cbd4df" stroke-width="2"/><text x="442" y="206" fill="#182c45" font-family="Arial, sans-serif" font-size="23" font-weight="700">SERVICE</text><text x="446" y="247" fill="#52647b" font-family="Arial, sans-serif" font-size="20" font-weight="400">Client</text><text x="643" y="247" fill="#52647b" font-family="Arial, sans-serif" font-size="20" font-weight="400">Server</text><path d="M482 269 L482 62