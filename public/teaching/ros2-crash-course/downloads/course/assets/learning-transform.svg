<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc"><title id="title">A transform changes the numbers</title><desc id="desc">A top view shows base x right and y up; a sensor translated 0.1 metres has x up and y left, a positive ninety-degree yaw. A point one metre along sensor x becomes (0.1,1,0.2) in the base after translation.</desc><rect width="1200" height="760" fill="#f5f7fa"/><text x="44" y="40" fill="#52647b" font-family="Arial, sans-serif" font-size="15" font-weight="700">NODES TO MAPS / CONCEPT EXPLAINER</text><text x="44" y="88" fill="#182c45" font-family="Arial, sans-serif" font-size="34" font-weight="700">A transform changes the numbers</text><text x="44" y="137" fill="#52647b" font-family="Arial, sans-serif" font-size="22" font-weight="400">One physical point, two coordinate descriptions. Top view; height is out of the page.</text><rect x="44" y="166" width="590" height="501" rx="12" fill="#fff" stroke="#cbd4df" stroke-width="2"/><rect x="658" y="166" width="498" height="501" rx="12" fill="#fff" stroke="#cbd4df" stroke-width="2"/><path d="M189 550 L565 550" fill="none" stroke="#2769ad" stroke-width="3" /><path d="M-10 -5L0 0L-10 5" transform="translate(565 550) rotate(0)" fill="none" stroke="#2769ad" stroke-width="3"/><path d="M189 550 L189 212" fill="none" stroke="#2769ad" stroke-width="3" /><path d="M-10 -5L0 0L-10 5" transform="translate(189 212) rotate(-90)" fill="none" stroke="#2769ad" stroke-width="3"/><text x="502" y="585" fill="#2769ad" font-family="Arial, sans-serif" font-size="21" font-weight="400">base x</text><text x="92" y="227" fill="#2769ad" font-family="Arial, sans-serif" font-size="21" font-weight="400">base y</text><circle cx="189" cy="550" r="7" fill="#2769ad"/><text x="67" y="610" fill="#2769ad" font-family="Arial, sans-serif" font-size="19" font-weight="400">base origin</text><path d="M249 550 L249 250" fill="none" stroke="#237969" stroke-width="3" /><path d="M-10 -5L0 0L-10 5" transform="translate(249 250) rotate(-90)" fill="none" stroke="#237969" stroke-width="3"/><path d="M249 550 L85 550" fill="none" stroke="#237969" stroke-width="3" /><path d="M-10 -5L0 0L-10 5" transform="translate(85 550) rotate(180)" fill="none" stroke="#237969" stroke-width="3"/><text x="270" y="264" fill="#237969" font-family="Arial, sans-serif" font-size="21" font-weight="400">sensor x</text><text x="67" y="510" fill="#237969" font-family="Arial, sans-serif" font-size="21" font-weight="400">sensor y</text><circle cx="249" cy="550" r="7" fill="#237969"/><circle cx="249" cy="250" r="10" fill="#bd632b"/><text x="287" y="306" fill="#bd632b" font-family="Arial, sans-serif" font-size="20" font-weight="400">same landmark</text><path d="M249 550 L249 250" fill="none" stroke="#bd632b" stroke-width="3" stroke-dasharray="6 6"/><text x="279" y="409" fill="#bd632b" font-family="Arial, sans-serif" font-size="20" font-weight="400">1 m along sensor x</text><path d="M189 636 L249 636" fill="none" stroke="#182c45" stroke-width="3" /><path d="M-10 -5L0 0L-10 5" transform="translate(249 636) rotate(0)" fill="none" stroke="#182c45" stroke-width="3"/><text x="295" y="640" fill="#182c45" font-family="Arial, sans-serif" font-size="19" font-weight="400">origin shift: 0.1 m</text><text x="682" y="210" fill="#237969" font-family="Arial, sans-serif" font-size="17" font-weight="700">IN THE SENSOR FRAME</text><text x="682" y="259" fill="#237969" font-family="Arial, sans-serif" font-size="27" font-weight="700">p = (1, 0, 0) m</text><text x="682" y="320" fill="#182c45" font-family="Arial, sans-serif" font-size="21" font-weight="400">1. Rotate +90° about base z</text><text x="705" y="360" fill="#182c45" font-family="Arial, sans-serif" font-size="22" font-weight="400">(1, 0, 0) → (0, 1, 0)</text><text x="682" y="423" fill="#182c45" font-family="Arial, sans-serif" font-size="21" font-weight="400">2. Add the sensor origin</text><text x="705" y="463" fill="#182c45" font-family="Arial, sans-serif" font-size="22" font-weight="400">t = (0.1, 0, 0.2) m</text><text x="682" y="526" fill="#2769ad" font-family="Arial, sans-serif" font-size="17" font-weight="700">IN THE BASE FRAME</text><text x="682" y="572" fill="#2769ad" font-family="Arial, sans-serif" font-size="26" font-weight="700">p = (0.1, 1.0, 0.2) m</text><text x="682" y="625" fill="#52647b" font-family="Arial, sans-serif" font-size="19" font-weight="400">The 0.2 m height is out of this view.</text><text x="44" y="709" fill="#52647b" font-family="Arial, sans-serif" font-size="20" font-weight="400">Axes schematic, not to scale. Changing frame_id alone would leave the coordinates wrong.</text><text x="44" y="735" fill="#52647b" font-family="Arial, sans-serif" font-size="15" font-weight="400">Original course diagram • schematic, not measured output • CC BY 4.0</text></svg>