<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">One Android app, two connection options</title><desc id="desc">USB limits movement to cable length. Wireless needs a qualified phone-to-laptop route.. Illustrative simulation, not an actual software run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#4b7764"/></marker></defs><rect width="1000" height="640" fill="#f6f3e9"/><text x="34" y="38" font-size="15" fill="#8d4f31" font-family="Arial, sans-serif">VISUAL CHECKPOINT · SIMULATED EXAMPLE</text><text x="34" y="82" font-size="30" fill="#213e34" font-family="Arial, sans-serif">One Android app, two connection options</text><rect x="40" y="124" width="280" height="94" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="58" y="160" font-size="22" fill="#213e34" font-family="Arial, sans-serif">OPTION 1 · WIRED USB</text><text x="58" y="192" font-size="16" fill="#557064" font-family="Arial, sans-serif">USB cable + debugging</text><path d="M330 171L423 171" stroke="#4b7764" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="440" y="124" width="520" height="94" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="458" y="160" font-size="22" fill="#213e34" font-family="Arial, sans-serif">ADB reverse → laptop localhost</text><text x="458" y="192" font-size="16" fill="#557064" font-family="Arial, sans-serif">App: wss://127.0.0.1:8443/ws/android</text><rect x="40" y="273" width="280" height="94" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="58" y="309" font-size="22" fill="#213e34" font-family="Arial, sans-serif">OPTION 2 · WIRELESS</text><text x="58" y="341" font-size="16" fill="#557064" font-family="Arial, sans-serif">Laptop joins the phone hotspot</text><path d="M330 320L423 320" stroke="#4b7764" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="440" y="273" width="520" height="94" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="458" y="309" font-size="22" fill="#213e34" font-family="Arial, sans-serif">Wi-Fi → laptop hotspot address</text><text x="458" y="341" font-size="16" fill="#557064" font-family="Arial, sans-serif">App: wss://LAPTOP_IP:8443/ws/android</text><path d="M966 171L980 171" stroke="#4b7764" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M980 171L980 470" stroke="#4b7764" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M980 470L963 470" stroke="#4b7764" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M698 373L698 409" stroke="#4b7764" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="440" y="422" width="520" height="94" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="458" y="458" font-size="22" fill="#213e34" font-family="Arial, sans-serif">Same phone_bridge and ROS topics</text><text x="458" y="490" font-size="16" fill="#557064" font-family="Arial, sans-serif">Same certificate pin, token and camera calibration</text><text x="47" y="464" font-size="20" fill="#213e34" font-family="Arial, sans-serif">WSL: ADB runs in Windows.</text><text x="47" y="498" font-size="19" fill="#213e34" font-family="Arial, sans-serif">See Annex F for forwarding.</text><text x="34" y="596" font-size="17" fill="#213e34" font-family="Arial, sans-serif">USB limits movement to cable length. Wireless needs a qualified phone-to-laptop route.</text><text x="34" y="622" font-size="14" fill="#65766b" font-family="Arial, sans-serif">Illustrative values and layout. Compare concepts; your software may look different.</text></svg>