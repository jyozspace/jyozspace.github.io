<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Confirm pixels before adding the mapper</title><desc id="desc">The viewer confirms decoded pixels. Topic rate measures samples received by that tool.. Illustrative simulation, not an actual software run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#4b7764"/></marker></defs><rect width="1000" height="640" fill="#f6f3e9"/><text x="34" y="38" font-size="15" fill="#8d4f31" font-family="Arial, sans-serif">VISUAL CHECKPOINT · SIMULATED EXAMPLE</text><text x="34" y="82" font-size="30" fill="#213e34" font-family="Arial, sans-serif">Confirm pixels before adding the mapper</text><rect x="34" y="112" width="548" height="441" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="53" y="150" font-size="20" fill="#213e34" font-family="Arial, sans-serif">image_view · /phone/camera/image_raw</text><rect x="54" y="173" width="508" height="320" rx="12" fill="#dce8df" stroke="#cbd5c8"/><path d="M55 380L200 270L365 300L560 210V492H55Z" fill="#91b19e"/><rect x="240" y="267" width="117" height="156" fill="#c7a685"/><ellipse cx="299" cy="268" rx="58" ry="16" fill="#e8d3af"/><path d="M356 290C425 270 425 390 358 370" fill="none" stroke="#c7a685" stroke-width="18"/><text x="60" y="531" font-size="18" fill="#213e34" font-family="Arial, sans-serif">Your scene, not this illustration, should be visible.</text><rect x="605" y="112" width="359" height="441" rx="12" fill="#18332b" stroke="#cbd5c8"/><text x="625" y="154" font-size="20" fill="#edf3e8" font-family="Arial, sans-serif">Inspection terminal</text><text x="625" y="205" font-size="17" fill="#b9d78f" font-family="monospace">$ ros2 topic hz</text><text x="625" y="237" font-size="16" fill="#b9d78f" font-family="monospace">/phone/camera/image_raw</text><text x="625" y="296" font-size="19" fill="#edf3e8" font-family="monospace">average rate: 9.7</text><text x="625" y="352" font-size="17" fill="#d4e0d1" font-family="Arial, sans-serif">Illustrative rate only.</text><text x="625" y="405" font-size="18" fill="#d4e0d1" font-family="Arial, sans-serif">Check image dimensions</text><text x="625" y="438" font-size="18" fill="#d4e0d1" font-family="Arial, sans-serif">against CameraInfo.</text><text x="625" y="500" font-size="18" fill="#d4e0d1" font-family="Arial, sans-serif">Fix transport first.</text><text x="34" y="596" font-size="17" fill="#213e34" font-family="Arial, sans-serif">The viewer confirms decoded pixels. Topic rate measures samples received by that tool.</text><text x="34" y="622" font-size="14" fill="#65766b" font-family="Arial, sans-serif">Illustrative values and layout. Compare concepts; your software may look different.</text></svg>