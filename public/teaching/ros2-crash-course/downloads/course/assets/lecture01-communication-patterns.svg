<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc"><title id="title">Choose an interface by the conversation it needs</title><desc id="desc">Three timelines compare topics, services and actions. Topic messages flow repeatedly from publisher to subscriber; a service exchanges one request and response; an action exchanges goal acceptance, feedback and final status with cancellation available during execution.</desc><defs><marker id="087f8c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087f8c"/></marker><marker id="2364c4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2364c4"/></marker><marker id="b95b27" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b95b27"/></marker><marker id="7953aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7953aa"/></marker><marker id="52677a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52677a"/></marker></defs><rect width="1400" height="860" fill="#f5f8fb"/><text x="48" y="45" fill="#087f8c" font-size="16" font-weight="700" font-family="Arial, sans-serif">LECTURE 01 / FOUNDATIONS</text><text x="48" y="95" fill="#152b3d" font-size="36" font-weight="700" font-family="Arial, sans-serif">Choose an interface by the conversation it needs</text><rect x="48" y="155" width="414" height="628" rx="14" fill="#fff" stroke="#d2dce5"/><text x="72" y="198" fill="#087f8c" font-size="29" font-weight="700" font-family="Arial, sans-serif">TOPIC</text><text x="72" y="234" fill="#52677a" font-size="20" font-weight="400" font-family="Arial, sans-serif">Repeated measurements</text><text x="72" y="289" fill="#152b3d" font-size="19" font-weight="700" font-family="Arial, sans-serif">Publisher</text><text x="320" y="289" fill="#152b3d" font-size="19" font-weight="700" font-family="Arial, sans-serif">Subscriber</text><path d="M119 310V693M381 310V693" stroke="#c0cdd8" stroke-width="2" stroke-dasharray="6 6"/><rect x="493" y="155" width="414" height="628" rx="14" fill="#fff" stroke="#d2dce5"/><text x="517" y="198" fill="#2364c4" font-size="29" font-weight="700" font-family="Arial, sans-serif">SERVICE</text><text x="517" y="234" fill="#52677a" font-size="20" font-weight="400" font-family="Arial, sans-serif">A brief request / response</text><text x="517" y="289" fill="#152b3d" font-size="19" font-weight="700" font-family="Arial, sans-serif">Client</text><text x="765" y="289" fill="#152b3d" font-size="19" font-weight="700" font-family="Arial, sans-serif">Server</text><path d="M564 310V693M826 310V693" stroke="#c0cdd8" stroke-width="2" stroke-dasharray="6 6"/><rect x="938" y="155" width="414" height="628" rx="14" fill="#fff" stroke="#d2dce5"/><text x="962" y="198" fill="#7953aa" font-size="29" font-weight="700" font-family="Arial, sans-serif">ACTION</text><text x="962" y="234" fill="#52677a" font-size="20" font-weight="400" font-family="Arial, sans-serif">A goal with progress</text><text x="962" y="289" fill="#152b3d" font-size="19" font-weight="700" font-family="Arial, sans-serif">Client</text><text x="1210" y="289" fill="#152b3d" font-size="19" font-weight="700" font-family="Arial, sans-serif">Server</text><path d="M1009 310V693M1271 310V693" stroke="#c0cdd8" stroke-width="2" stroke-dasharray="6 6"/><path d="M119 358H376" fill="none" stroke="#087f8c" stroke-width="3"  marker-end="url(#087f8c)"/><text x="176" y="343" fill="#087f8c" font-size="20" font-weight="700" font-family="Arial, sans-serif">Frame 1</text><path d="M119 440H376" fill="none" stroke="#087f8c" stroke-width="3"  marker-end="url(#087f8c)"/><text x="176" y="425" fill="#087f8c" font-size="20" font-weight="700" font-family="Arial, sans-serif">Frame 2</text><path d="M119 522H376" fill="none" stroke="#087f8c" stroke-width="3"  marker-end="url(#087f8c)"/><text x="176" y="507" fill="#087f8c" font-size="20" font-weight="700" font-family="Arial, sans-serif">Frame 3</text><text x="72" y="642" fill="#52677a" font-size="20" font-weight="400" font-family="Arial, sans-serif">No per-sample reply required.</text><text x="72" y="736" fill="#087f8c" font-size="21" font-weight="700" font-family="Arial, sans-serif">Example: camera stream</text><path d="M564 358H821" fill="none" stroke="#2364c4" stroke-width="3"  marker-end="url(#2364c4)"/><text x="624" y="343" fill="#2364c4" font-size="20" font-weight="700" font-family="Arial, sans-serif">Request</text><path d="M826 477H569" fill="none" stroke="#2364c4" stroke-width="3"  marker-end="url(#2364c4)"/><text x="624" y="462" fill="#2364c4" font-size="20" font-weight="700" font-family="Arial, sans-serif">Response</text><text x="517" y="642" fill="#52677a" font-size="20" font-weight="400" font-family="Arial, sans-serif">One result for one request.</text><text x="517" y="736" fill="#2364c4" font-size="21" font-weight="700" font-family="Arial, sans-serif">Example: clear drawing</text><path d="M1009 345H1266" fill="none" stroke="#7953aa" stroke-width="3"  marker-end="url(#7953aa)"/><text x="1070" y="333" fill="#7953aa" font-size="18" font-weight="700" font-family="Arial, sans-serif">Goal</text><path d="M1271 410H1014" fill="none" stroke="#7953aa" stroke-width="3"  marker-end="url(#7953aa)"/><text x="1070" y="398" fill="#7953aa" font-size="18" font-weight="700" font-family="Arial, sans-serif">Accepted</text><path d="M1271 480H1014" fill="none" stroke="#7953aa" stroke-width="3"  marker-end="url(#7953aa)"/><text x="1070" y="468" fill="#7953aa" font-size="18" font-weight="700" font-family="Arial, sans-serif">Feedback</text><path d="M1271 550H1014" fill="none" stroke="#7953aa" stroke-width="3"  marker-end="url(#7953aa)"/><text x="1070" y="538" fill="#7953aa" font-size="18" font-weight="700" font-family="Arial, sans-serif">Feedback</text><path d="M1271 670H1014" fill="none" stroke="#7953aa" stroke-width="3"  marker-end="url(#7953aa)"/><text x="1070" y="658" fill="#7953aa" font-size="18" font-weight="700" font-family="Arial, sans-serif">Result + status</text><text x="963" y="600" fill="#52677a" font-size="18" font-weight="400" font-family="Arial, sans-serif">Cancellation may be requested</text><text x="963" y="624" fill="#52677a" font-size="18" font-weight="400" font-family="Arial, sans-serif">while the goal is running.</text><text x="962" y="736" fill="#7953aa" font-size="21" font-weight="700" font-family="Arial, sans-serif">Example: navigate to a goal</text><text x="48" y="132" fill="#52677a" font-size="15" font-weight="700" font-family="Arial, sans-serif">TIME FLOWS DOWN EACH PANEL</text><text x="48" y="831" fill="#52677a" font-size="14" font-weight="400" font-family="Arial, sans-serif">ORIGINAL CONCEPT DIAGRAM · CC BY 4.0 · NODES TO MAPS</text></svg>