<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">WSL 2: first connect over USB</title><desc id="desc">Wi-Fi routes use mirrored networking or a scoped Windows-to-WSL TCP proxy.. Illustrative simulation, not an actual software run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#4b7764"/></marker></defs><rect width="1000" height="640" fill="#f6f3e9"/><text x="34" y="38" font-size="15" fill="#8d4f31" font-family="Arial, sans-serif">VISUAL CHECKPOINT · SIMULATED EXAMPLE</text><text x="34" y="82" font-size="30" fill="#213e34" font-family="Arial, sans-serif">WSL 2: first connect over USB</text><rect x="40" y="134" width="281" height="94" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="58" y="170" font-size="22" fill="#213e34" font-family="Arial, sans-serif">Android sensor APK</text><text x="58" y="202" font-size="16" fill="#557064" font-family="Arial, sans-serif">wss://127.0.0.1:8443</text><path d="M328 181L427 181" stroke="#4b7764" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="440" y="134" width="520" height="94" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="458" y="170" font-size="22" fill="#213e34" font-family="Arial, sans-serif">Windows ADB</text><text x="458" y="202" font-size="16" fill="#557064" font-family="Arial, sans-serif">adb reverse tcp:8443 tcp:8443</text><text x="339" y="159" font-size="16" fill="#213e34" font-family="Arial, sans-serif">USB</text><path d="M700 234L700 288" stroke="#4b7764" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="440" y="299" width="520" height="94" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="458" y="335" font-size="22" fill="#213e34" font-family="Arial, sans-serif">Windows localhost:8443</text><text x="458" y="367" font-size="16" fill="#557064" font-family="Arial, sans-serif">Normal WSL localhost forwarding</text><path d="M700 399L700 450" stroke="#4b7764" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="440" y="464" width="520" height="94" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="458" y="500" font-size="22" fill="#213e34" font-family="Arial, sans-serif">Ubuntu 24.04 in WSL 2</text><text x="458" y="532" font-size="16" fill="#557064" font-family="Arial, sans-serif">phone_bridge → ROS → optional mapper</text><text x="47" y="317" font-size="20" fill="#213e34" font-family="Arial, sans-serif">Check Windows localhost first:</text><text x="47" y="361" font-size="20" fill="#213e34" font-family="monospace">Test-NetConnection</text><text x="47" y="396" font-size="18" fill="#213e34" font-family="monospace">127.0.0.1 -Port 8443</text><text x="47" y="452" font-size="21" fill="#213e34" font-family="Arial, sans-serif">Then pair the APK and</text><text x="47" y="488" font-size="21" fill="#213e34" font-family="Arial, sans-serif">inspect ROS image data.</text><text x="34" y="596" font-size="17" fill="#213e34" font-family="Arial, sans-serif">Wi-Fi routes use mirrored networking or a scoped Windows-to-WSL TCP proxy.</text><text x="34" y="622" font-size="14" fill="#65766b" font-family="Arial, sans-serif">Illustrative values and layout. Compare concepts; your software may look different.</text></svg>