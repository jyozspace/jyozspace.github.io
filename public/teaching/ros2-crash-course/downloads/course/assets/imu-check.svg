<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Separate a sensor check from calibration</title><desc id="desc">Check sensor time, API conventions and axes on the actual phone.. Illustrative simulation, not an actual software run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#4b7764"/></marker></defs><rect width="1000" height="640" fill="#f6f3e9"/><text x="34" y="38" font-size="15" fill="#8d4f31" font-family="Arial, sans-serif">VISUAL CHECKPOINT · SIMULATED EXAMPLE</text><text x="34" y="82" font-size="30" fill="#213e34" font-family="Arial, sans-serif">Separate a sensor check from calibration</text><rect x="40" y="132" width="430" height="94" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="58" y="168" font-size="22" fill="#213e34" font-family="Arial, sans-serif">Stationary phone</text><text x="58" y="200" font-size="16" fill="#557064" font-family="Arial, sans-serif">Gyroscope should be near zero</text><rect x="528" y="132" width="430" height="94" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="546" y="168" font-size="22" fill="#213e34" font-family="Arial, sans-serif">Slow turn about one device axis</text><text x="546" y="200" font-size="16" fill="#557064" font-family="Arial, sans-serif">Check the sign and dominant component</text><text x="55" y="300" font-size="25" fill="#213e34" font-family="Arial, sans-serif">Acceleration includes gravity:</text><text x="55" y="340" font-size="23" fill="#213e34" font-family="Arial, sans-serif">vector magnitude often near 9.8 m/s² at rest.</text><text x="55" y="381" font-size="21" fill="#213e34" font-family="Arial, sans-serif">Expected axis signs depend on phone orientation.</text><text x="55" y="445" font-size="24" fill="#213e34" font-family="Arial, sans-serif">Device sensor axes ≠ transmitted camera optical axes.</text><text x="55" y="488" font-size="21" fill="#213e34" font-family="Arial, sans-serif">Record the observation, orientation and Android app version.</text><text x="55" y="531" font-size="19" fill="#213e34" font-family="Arial, sans-serif">An axis check measures behavior; it does not solve camera–IMU extrinsics.</text><text x="34" y="596" font-size="17" fill="#213e34" font-family="Arial, sans-serif">Check sensor time, API conventions and axes on the actual phone.</text><text x="34" y="622" font-size="14" fill="#65766b" font-family="Arial, sans-serif">Illustrative values and layout. Compare concepts; your software may look different.</text></svg>