<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">A listed topic can still be silent</title><desc id="desc">Changing queue depth cannot repair this reliability mismatch.. Illustrative simulation, not an actual software run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#4b7764"/></marker></defs><rect width="1000" height="640" fill="#f6f3e9"/><text x="34" y="38" font-size="15" fill="#8d4f31" font-family="Arial, sans-serif">VISUAL CHECKPOINT · SIMULATED EXAMPLE</text><text x="34" y="82" font-size="30" fill="#213e34" font-family="Arial, sans-serif">A listed topic can still be silent</text><rect x="40" y="148" width="390" height="94" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="58" y="184" font-size="22" fill="#213e34" font-family="Arial, sans-serif">Publisher offers BEST EFFORT</text><text x="58" y="216" font-size="16" fill="#557064" font-family="Arial, sans-serif">/qos_demo · std_msgs/msg/String</text><rect x="570" y="148" width="390" height="94" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="588" y="184" font-size="22" fill="#213e34" font-family="Arial, sans-serif">Subscriber requests RELIABLE</text><text x="588" y="216" font-size="16" fill="#557064" font-family="Arial, sans-serif">This request is stronger than the offer</text><path d="M436 197L561 197" stroke="#4b7764" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="54" y="303" font-size="23" fill="#213e34" font-family="Arial, sans-serif">1. Inspect: ros2 topic info /qos_demo --verbose</text><text x="54" y="354" font-size="22" fill="#213e34" font-family="Arial, sans-serif">2. Stop echo, then request a compatible policy:</text><rect x="40" y="381" width="920" height="77" rx="12" fill="#18332b" stroke="#cbd5c8"/><text x="60" y="427" font-size="19" fill="#eaf3e5" font-family="monospace">ros2 topic echo /qos_demo --qos-reliability best_effort</text><text x="54" y="512" font-size="25" fill="#213e34" font-family="Arial, sans-serif">3. Expect data: hello</text><text x="34" y="596" font-size="17" fill="#213e34" font-family="Arial, sans-serif">Changing queue depth cannot repair this reliability mismatch.</text><text x="34" y="622" font-size="14" fill="#65766b" font-family="Arial, sans-serif">Illustrative values and layout. Compare concepts; your software may look different.</text></svg>