<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">A response, then progress toward a goal</title><desc id="desc">A service answers one request. An action also supplies feedback and a terminal state.. Illustrative simulation, not an actual software run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#4b7764"/></marker></defs><rect width="1000" height="640" fill="#f6f3e9"/><text x="34" y="38" font-size="15" fill="#8d4f31" font-family="Arial, sans-serif">VISUAL CHECKPOINT · SIMULATED EXAMPLE</text><text x="34" y="82" font-size="30" fill="#213e34" font-family="Arial, sans-serif">A response, then progress toward a goal</text><rect x="34" y="108" width="932" height="449" rx="12" fill="#18332b" stroke="#18332b"/><text x="58" y="143" font-size="16" fill="#b9cbbb" font-family="Arial, sans-serif">Ubuntu · Bash — illustrative terminal output</text><text x="58" y="184" font-size="18" fill="#eef3e9" font-family="monospace">Service request: width 3.0, height 4.0</text><text x="58" y="215" font-size="18" fill="#eef3e9" font-family="monospace">Response: area=12.0, valid=True</text><text x="58" y="246" font-size="18" fill="#eef3e9" font-family="monospace"></text><text x="58" y="277" font-size="18" fill="#eef3e9" font-family="monospace">Action goal: target 8, period 0.5</text><text x="58" y="308" font-size="18" fill="#eef3e9" font-family="monospace">Goal accepted</text><text x="58" y="339" font-size="18" fill="#eef3e9" font-family="monospace">Feedback: current_number=1</text><text x="58" y="370" font-size="18" fill="#eef3e9" font-family="monospace">Feedback: current_number=2</text><text x="58" y="401" font-size="18" fill="#eef3e9" font-family="monospace">...</text><text x="58" y="432" font-size="18" fill="#eef3e9" font-family="monospace">Result: reached_number=8</text><text x="58" y="463" font-size="18" fill="#eef3e9" font-family="monospace">Goal finished with status: SUCCEEDED</text><text x="34" y="596" font-size="17" fill="#213e34" font-family="Arial, sans-serif">A service answers one request. An action also supplies feedback and a terminal state.</text><text x="34" y="622" font-size="14" fill="#65766b" font-family="Arial, sans-serif">Illustrative values and layout. Compare concepts; your software may look different.</text></svg>