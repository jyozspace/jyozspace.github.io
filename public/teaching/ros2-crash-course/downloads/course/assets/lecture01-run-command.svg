<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Start a node with ros2 run</title><desc id="desc">ros2 run selects the package turtlesim and executable turtlesim_node. This program creates the runtime node /turtlesim. A package, executable and node have distinct names.</desc><rect width="1200" height="650" fill="#f6f5f0"/><g font-family="Arial,sans-serif" fill="#1b3634"><text x="40" y="48" font-size="17" fill="#235c4b">LECTURE 01 / BASIC COMMAND</text><text x="40" y="104" font-size="38" font-weight="700">Start a node with ros2 run</text><rect x="40" y="140" width="1120" height="120" rx="14" fill="#1b3634"/><text x="72" y="215" font-size="35" font-family="Consolas,monospace" fill="#fffefa">ros2 run <tspan fill="#efba83">turtlesim</tspan> <tspan fill="#d4edab">turtlesim_node</tspan></text><path d="M455 230V295H230V320 M820 230V295H780V320" fill="none" stroke="#6a7771" stroke-width="2"/><rect x="40" y="320" width="480" height="140" rx="14" fill="#eaf0e5" stroke="#dce1d7"/><rect x="550" y="320" width="610" height="140" rx="14" fill="#eaf0e5" stroke="#dce1d7"/><text x="62" y="357" font-size="21" font-weight="700" fill="#b96d3f">PACKAGE: turtlesim</text><text x="62" y="394" font-size="21">The software package to look in</text><text x="62" y="432" font-size="19">Declared by its package.xml</text><text x="572" y="357" font-size="21" font-weight="700" fill="#235c4b">EXECUTABLE: turtlesim_node</text><text x="572" y="394" font-size="21">The installed program to start</text><text x="572" y="432" font-size="19">This program creates node /turtlesim</text><text x="40" y="514" font-size="25" font-weight="700">Pattern: ros2 run PACKAGE EXECUTABLE</text><text x="40" y="558" font-size="22">The node name belongs to the running program; it can differ from the executable name.</text><text x="40" y="615" font-size="16" fill="#6a7771">Original course diagram · CC BY 4.0 · no extra options needed for this first command</text></g></svg>