<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="870" viewBox="0 0 1400 870" role="img" aria-labelledby="title desc"><title id="title">Read a ROS 2 startup command</title><desc id="desc">The ros2 run command selects package examples_rclpy_minimal_publisher and executable publisher_member_function. ROS arguments rename the node demo_talker, remap topic to /hello, and set use_sim_time false. Run selects an executable; launch selects a launch description.</desc><rect width="1400" height="870" fill="#f6f5f0"/><text x="40" y="38" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#235c4b">LECTURE 01 / COMMAND REFERENCE</text><text x="40" y="86" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#1b3634">Read a ROS 2 startup command</text><rect x="40" y="116" width="1320" height="176" rx="14" fill="#1b3634" stroke="#dce1d7"/><text x="62" y="148" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#d4edab">UBUNTU TERMINAL · one Bash command, continued on the second line</text><text x="62" y="202" font-family="Consolas,monospace" font-size="19" fill="#fffefa">$ ros2 run <tspan fill="#efba83">examples_rclpy_minimal_publisher</tspan> <tspan fill="#d4edab">publisher_member_function</tspan> --ros-args &#92;</text><text x="87" y="250" font-family="Consolas,monospace" font-size="23" font-weight="400" fill="#fffefa">-r __node:=demo_talker -r topic:=/hello -p use_sim_time:=false</text><rect x="40" y="318" width="420" height="155" rx="14" fill="#eaf0e5" stroke="#dce1d7"/><text x="58" y="350" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#b96d3f">1  PACKAGE</text><text x="58" y="383" font-family="Consolas,monospace" font-size="17" font-weight="600" fill="#1b3634">examples_rclpy_minimal_publisher</text><text x="58" y="418" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#1b3634">Declared in package.xml</text><text x="58" y="449" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#6a7771">An installable unit of ROS software</text><rect x="490" y="318" width="420" height="155" rx="14" fill="#eaf0e5" stroke="#dce1d7"/><text x="508" y="350" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#235c4b">2  EXECUTABLE</text><text x="508" y="383" font-family="Consolas,monospace" font-size="17" font-weight="600" fill="#1b3634">publisher_member_function</text><text x="508" y="418" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#1b3634">Registered by setup.py</text><text x="508" y="449" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#6a7771">The program selected by ros2 run</text><rect x="940" y="318" width="420" height="155" rx="14" fill="#eaf0e5" stroke="#dce1d7"/><text x="958" y="350" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#235c4b">3  NODE NAME</text><text x="958" y="383" font-family="Consolas,monospace" font-size="17" font-weight="600" fill="#1b3634">-r __node:=demo_talker</text><text x="958" y="418" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#1b3634">Runtime name: /demo_talker</text><text x="958" y="449" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#6a7771">Does not rename the source file</text><rect x="40" y="500" width="645" height="155" rx="14" fill="#eaf0e5" stroke="#dce1d7"/><text x="58" y="532" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#235c4b">4  TOPIC REMAPPING</text><text x="58" y="565" font-family="Consolas,monospace" font-size="23" font-weight="600" fill="#1b3634">-r topic:=/hello</text><text x="58" y="600" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#1b3634">Original topic name → /hello</text><text x="58" y="631" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#6a7771">Connect another consumer using /hello</text><rect x="715" y="500" width="645" height="155" rx="14" fill="#eaf0e5" stroke="#dce1d7"/><text x="733" y="532" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#b96d3f">5  PARAMETER</text><text x="733" y="565" font-family="Consolas,monospace" font-size="23" font-weight="600" fill="#1b3634">-p use_sim_time:=false</text><text x="733" y="600" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#1b3634">Use the system clock for this node</text><text x="733" y="631" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#6a7771">Other settings must be supported by the node</text><text x="40" y="704" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#235c4b">RUN</text><text x="155" y="704" font-family="Consolas,monospace" font-size="22" font-weight="600" fill="#1b3634">ros2 run PACKAGE EXECUTABLE</text><text x="845" y="704" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#1b3634">Start one installed executable</text><text x="40" y="749" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#235c4b">LAUNCH</text><text x="155" y="749" font-family="Consolas,monospace" font-size="22" font-weight="600" fill="#1b3634">ros2 launch PACKAGE LAUNCH_FILE</text><text x="845" y="749" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#1b3634">Execute a startup description</text><text x="40" y="800" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#1b3634">Launch arguments belong to the launch file; node parameters belong to nodes.</text><text x="40" y="846" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#6a7771">Original vector diagram · CC BY 4.0 · identifiers match the Jazzy examples source · open full size for detail</text></svg>