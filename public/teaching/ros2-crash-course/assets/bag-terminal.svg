<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Record once; replay a repeatable experiment</title><desc id="desc">Your bag includes its own counts, duration and storage format. Inspect those before replay.. Illustrative simulation, not an actual software run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#4b7764"/></marker></defs><rect width="1000" height="640" fill="#f6f3e9"/><text x="34" y="38" font-size="15" fill="#8d4f31" font-family="Arial, sans-serif">VISUAL CHECKPOINT · SIMULATED EXAMPLE</text><text x="34" y="82" font-size="30" fill="#213e34" font-family="Arial, sans-serif">Record once; replay a repeatable experiment</text><rect x="34" y="108" width="932" height="449" rx="12" fill="#18332b" stroke="#18332b"/><text x="58" y="143" font-size="16" fill="#b9cbbb" font-family="Arial, sans-serif">Ubuntu · Bash — illustrative terminal output</text><text x="58" y="184" font-size="18" fill="#b9d78f" font-family="monospace">$ ros2 bag info ~/phone-lab/walk01</text><text x="58" y="215" font-size="18" fill="#eef3e9" font-family="monospace">Storage id: mcap  (default Jazzy installation)</text><text x="58" y="246" font-size="18" fill="#eef3e9" font-family="monospace">Topic information:</text><text x="58" y="277" font-size="18" fill="#eef3e9" font-family="monospace"> /phone/camera/image_raw      sensor_msgs/msg/Image</text><text x="58" y="308" font-size="18" fill="#eef3e9" font-family="monospace"> /phone/camera/camera_info    sensor_msgs/msg/CameraInfo</text><text x="58" y="339" font-size="18" fill="#eef3e9" font-family="monospace"> /phone/imu/accelerometer     sensor_msgs/msg/Imu</text><text x="58" y="370" font-size="18" fill="#eef3e9" font-family="monospace"> /phone/imu/gyroscope         sensor_msgs/msg/Imu</text><text x="58" y="401" font-size="18" fill="#eef3e9" font-family="monospace"> /phone/diagnostics           std_msgs/msg/String</text><text x="58" y="432" font-size="18" fill="#eef3e9" font-family="monospace"></text><text x="58" y="463" font-size="18" fill="#eef3e9" font-family="monospace">Stop live sources. Start consumers with use_sim_time:=true.</text><text x="58" y="494" font-size="18" fill="#b9d78f" font-family="monospace">$ ros2 bag play ~/phone-lab/walk01 --clock --rate 0.5</text><text x="58" y="525" font-size="18" fill="#eef3e9" font-family="monospace">Playback publishes /clock and the recorded sensor topics.</text><text x="34" y="596" font-size="17" fill="#213e34" font-family="Arial, sans-serif">Your bag includes its own counts, duration and storage format. Inspect those before replay.</text><text x="34" y="622" font-size="14" fill="#65766b" font-family="Arial, sans-serif">Illustrative values and layout. Compare concepts; your software may look different.</text></svg>