<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Pair the native Android sensor app</title><desc id="desc">This simulated app screen shows inspection points; qualify camera and sensors on your phone.. Illustrative simulation, not an actual software run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#4b7764"/></marker></defs><rect width="1000" height="640" fill="#f6f3e9"/><text x="34" y="38" font-size="15" fill="#8d4f31" font-family="Arial, sans-serif">VISUAL CHECKPOINT · SIMULATED EXAMPLE</text><text x="34" y="82" font-size="30" fill="#213e34" font-family="Arial, sans-serif">Pair the native Android sensor app</text><rect x="40" y="112" width="409" height="441" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="61" y="150" font-size="23" fill="#213e34" font-family="Arial, sans-serif">Nodes to Maps · Android sensor</text><text x="61" y="190" font-size="17" fill="#213e34" font-family="Arial, sans-serif">Secure receiver address</text><rect x="60" y="203" width="370" height="38" rx="12" fill="#edf2e9" stroke="#cbd5c8"/><text x="70" y="230" font-size="16" fill="#213e34" font-family="Arial, sans-serif">wss://LAPTOP:8443/ws/android</text><text x="61" y="273" font-size="17" fill="#213e34" font-family="Arial, sans-serif">Session token + certificate SHA-256</text><rect x="60" y="287" width="370" height="38" rx="12" fill="#edf2e9" stroke="#cbd5c8"/><text x="70" y="314" font-size="16" fill="#213e34" font-family="Arial, sans-serif">Copy both values from the laptop</text><rect x="60" y="352" width="370" height="62" rx="12" fill="#284d43" stroke="#cbd5c8"/><text x="90" y="391" font-size="23" fill="#eef3e9" font-family="Arial, sans-serif">Start camera + sensors</text><text x="61" y="458" font-size="20" fill="#213e34" font-family="Arial, sans-serif">Streaming · clock RTT 8 ms</text><text x="61" y="505" font-size="19" fill="#213e34" font-family="Arial, sans-serif">Stop &amp; release sensors</text><rect x="474" y="112" width="490" height="441" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="495" y="151" font-size="23" fill="#213e34" font-family="Arial, sans-serif">Inspect the actual capture mode</text><text x="495" y="202" font-size="23" fill="#213e34" font-family="Arial, sans-serif">Rear camera 0 · 640 × 480</text><text x="495" y="249" font-size="25" fill="#213e34" font-family="Arial, sans-serif">Clock: REALTIME</text><text x="495" y="288" font-size="17" fill="#213e34" font-family="Arial, sans-serif">Shared phone clock with sensor events</text><text x="495" y="338" font-size="20" fill="#213e34" font-family="Arial, sans-serif">Images 100 · Accel 500 · Gyro 500</text><text x="495" y="386" font-size="18" fill="#213e34" font-family="Arial, sans-serif">Example counts and RTT only.</text><text x="495" y="432" font-size="19" fill="#213e34" font-family="Arial, sans-serif">UNKNOWN clock → callback estimate</text><text x="495" y="481" font-size="18" fill="#213e34" font-family="Arial, sans-serif">Both modes: core mapper uses images.</text><text x="495" y="519" font-size="17" fill="#213e34" font-family="Arial, sans-serif">Preview retains native pixel orientation.</text><text x="34" y="596" font-size="17" fill="#213e34" font-family="Arial, sans-serif">This simulated app screen shows inspection points; qualify camera and sensors on your phone.</text><text x="34" y="622" font-size="14" fill="#65766b" font-family="Arial, sans-serif">Illustrative values and layout. Compare concepts; your software may look different.</text></svg>