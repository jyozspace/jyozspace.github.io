<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Check Ubuntu and its text settings</title><desc id="desc">Run the locale setup block first; your other locale categories may differ.. Illustrative simulation, not an actual software run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#4b7764"/></marker></defs><rect width="1000" height="640" fill="#f6f3e9"/><text x="34" y="38" font-size="15" fill="#8d4f31" font-family="Arial, sans-serif">VISUAL CHECKPOINT · SIMULATED EXAMPLE</text><text x="34" y="82" font-size="30" fill="#213e34" font-family="Arial, sans-serif">Check Ubuntu and its text settings</text><rect x="34" y="108" width="932" height="449" rx="12" fill="#18332b" stroke="#18332b"/><text x="58" y="143" font-size="16" fill="#b9cbbb" font-family="Arial, sans-serif">Ubuntu · Bash — simulated screen</text><text x="58" y="184" font-size="17" fill="#b9d78f" font-family="monospace">$ lsb_release -cs</text><text x="58" y="214" font-size="17" fill="#eef3e9" font-family="monospace">noble</text><text x="58" y="244" font-size="17" fill="#eef3e9" font-family="monospace"></text><text x="58" y="274" font-size="17" fill="#b9d78f" font-family="monospace">$ locale</text><text x="58" y="304" font-size="17" fill="#eef3e9" font-family="monospace">LANG=en_US.UTF-8</text><text x="58" y="334" font-size="17" fill="#eef3e9" font-family="monospace">LANGUAGE=</text><text x="58" y="364" font-size="17" fill="#eef3e9" font-family="monospace">LC_CTYPE=&quot;en_US.UTF-8&quot;</text><text x="58" y="394" font-size="17" fill="#eef3e9" font-family="monospace">... remaining locale categories ...</text><text x="58" y="424" font-size="17" fill="#eef3e9" font-family="monospace"></text><text x="58" y="454" font-size="17" fill="#eef3e9" font-family="monospace">noble = Ubuntu 24.04</text><text x="58" y="484" font-size="17" fill="#eef3e9" font-family="monospace">UTF-8 = a text format ROS can use</text><text x="34" y="596" font-size="17" fill="#213e34" font-family="Arial, sans-serif">Run the locale setup block first; your other locale categories may differ.</text><text x="34" y="622" font-size="14" fill="#65766b" font-family="Arial, sans-serif">Illustrative values and layout. Compare concepts; your software may look different.</text></svg>