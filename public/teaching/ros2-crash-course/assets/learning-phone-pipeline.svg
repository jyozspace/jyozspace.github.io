<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc"><title id="title">Find the boundary where the data changes meaning</title><desc id="desc">Android camera and independent motion events cross WSS to phone_bridge; images and CameraInfo feed the monocular mapper while separate motion topics are inspected and recorded.</desc><rect width="1200" height="760" fill="#f5f7fa"/><text x="44" y="40" fill="#52647b" font-family="Arial, sans-serif" font-size="15" font-weight="700">NODES TO MAPS / CONCEPT EXPLAINER</text><text x="44" y="88" fill="#182c45" font-family="Arial, sans-serif" font-size="34" font-weight="700">Find the boundary where the data changes meaning</text><rect x="44" y="158" width="315" height="460" rx="12" fill="#edf2fa" stroke="#cbd4df" stroke-width="2"/><text x="65" y="198" fill="#2769ad" font-family="Arial, sans-serif" font-size="19" font-weight="700">ANDROID PHONE</text><rect x="64" y="225" width="275" height="106" rx="12" fill="#fff" stroke="#cbd4df" stroke-width="2"/><text x="82" y="262" fill="#2769ad" font-family="Arial, sans-serif" font-size="24" font-weight="700">Camera2</text><text x="82" y="298" fill="#182c45" font-family="Arial, sans-serif" font-size="19" font-weight="400">image + capture time</text><rect x="64" y="370" width="275" height="154" rx="12" fill="#fff" stroke="#cbd4df" stroke-width="2"/><text x="82" y="410" fill="#237969" font-family="Arial, sans-serif" font-size="23" font-weight="700">SensorManager</text><text x="82" y="450" fill="#182c45" font-family="Arial, sans-serif" font-size="19" font-weight="400">accelerometer events</text><text x="82" y="486" fill="#182c45" font-family="Arial, sans-serif" font-size="19" font-weight="400">gyroscope events</text><text x="64" y="572" fill="#52647b" font-family="Arial, sans-serif" font-size="18" font-weight="400">No ROS installation on phone</text><path d="M360 294 L438 294" fill="none" stroke="#2769ad" stroke-width="3" /><path d="M-10 -5L0 0L-10 5" transform="translate(438 294) rotate(0)" fill="none" stroke="#2769ad" stroke-width="3"/><path d="M360 451 L438 451" fill="none" stroke="#237969" stroke-width="3" /><path d="M-10 -5L0 0L-10 5" transform="translate(438 451) rotate(0)" fill="none" stroke="#237969" stroke-width="3"/><text x="370" y="267" fill="#52647b" font-family="Arial, sans-serif" font-size="17" font-weight="400">WSS</text><rect x="446" y="158" width="302" height="460" rx="12" fill="#fff" stroke="#cbd4df" stroke-width="2"/><text x="465" y="198" fill="#2769ad" font-family="Arial, sans-serif" font-size="19" font-weight="700">UBUNTU / ROS 2</text><text x="465" y="240" fill="#182c45" font-family="Arial, sans-serif" font-size="25" font-weight="700">phone_bridge</text><text x="465" y="277" fill="#52647b" font-family="Arial, sans-serif" font-size="18" font-weight="400">validate • decode • stamp</text><rect x="465" y="311" width="264" height="94" rx="12" fill="#edf2fa" stroke="#cbd4df" stroke-width="2"/><text x="482" y="346" fill="#2769ad" font-family="Arial, sans-serif" font-size="21" font-weight="400">Image + CameraInfo</text><text x="482" y="380" fill="#52647b" font-family="Arial, sans-serif" font-size="16" font-weight="400">matching camera geometry</text><rect x="465" y="441" width="264" height="106" rx="12" fill="#e0f1eb" stroke="#cbd4df" stroke-width="2"/><text x="482" y="478" fill="#237969" font-family="Arial, sans-serif" font-size="19" font-weight="400">Two separate Imu topics</text><text x="482" y="516" fill="#52647b" font-family="Arial, sans-serif" font-size="17" font-weight="400">independent event times</text><path d="M750 356 L827 356" fill="none" stroke="#2769ad" stroke-width="3" /><path d="M-10 -5L0 0L-10 5" transform="translate(827 356) rotate(0)" fill="none" stroke="#2769ad" stroke-width="3"/><path d="M750 493 L827 493" fill="none" stroke="#237969" stroke-width="3" /><path d="M-10 -5L0 0L-10 5" transform="translate(827 493) rotate(0)" fill="none" stroke="#237969" stroke-width="3"/><rect x="835" y="158" width="321" height="460" rx="12" fill="#fff" stroke="#cbd4df" stroke-width="2"/><text x="854" y="198" fill="#2769ad" font-family="Arial, sans-serif" font-size="19" font-weight="700">CONSUMERS</text><text x="855" y="253" fill="#182c45" font-family="Arial, sans-serif" font-size="23" font-weight="700">Camera-only mapper</text><text x="855" y="292" fill="#182c45" font-family="Arial, sans-serif" font-size="18" font-weight="400">images + measured calibration</text><text x="855" y="339" fill="#2769ad" font-family="Arial, sans-serif" font-size="19" font-weight="400">poses • landmarks • status</text><path d="M855 383 L1135 383" fill="none" stroke="#cbd4df" stroke-width="3" /><text x="855" y="428" fill="#237969" font-family="Arial, sans-serif" font-size="23" font-weight="700">Inspect and record</text><text x="855" y="468" fill="#182c45" font-family="Arial, sans-serif" font-size="19" font-weight="400">image viewer • topic tools</text><text x="855" y="506" fill="#182c45" font-family="Arial, sans-serif" font-size="19" font-weight="400">rosbag2 camera + IMU</text><text x="855" y="566" fill="#ac3b4a" font-family="Arial, sans-serif" font-size="17" font-weight="400">IMU is not fused by this adapter.</text><text x="44" y="670" fill="#52647b" font-family="Arial, sans-serif" font-size="21" font-weight="400">USB (ADB reverse) or Wi-Fi transports WSS. DDS communication starts at the ROS receiver.</text><text x="44" y="707" fill="#52647b" font-family="Arial, sans-serif" font-size="20" font-weight="400">Separate stages let you test transport, measurement quality and estimation independently.</text><text x="44" y="735" fill="#52647b" font-family="Arial, sans-serif" font-size="15" font-weight="400">Original course diagram • schematic, not measured output • CC BY 4.0</text></svg>