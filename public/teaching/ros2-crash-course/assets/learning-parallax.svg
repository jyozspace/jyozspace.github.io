<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc"><title id="title">Why a moving camera can recover structure</title><desc id="desc">Two distinct camera centres observe one landmark with intersecting rays. Translation creates a baseline; monocular image geometry does not by itself set metric scale.</desc><rect width="1200" height="760" fill="#f5f7fa"/><text x="44" y="40" fill="#52647b" font-family="Arial, sans-serif" font-size="15" font-weight="700">NODES TO MAPS / CONCEPT EXPLAINER</text><text x="44" y="88" fill="#182c45" font-family="Arial, sans-serif" font-size="34" font-weight="700">Why a moving camera can recover structure</text><text x="44" y="136" fill="#52647b" font-family="Arial, sans-serif" font-size="22" font-weight="400">A pixel gives a viewing direction. Translation gives another view of the same landmark.</text><rect x="44" y="166" width="640" height="490" rx="12" fill="#fff" stroke="#cbd4df" stroke-width="2"/><rect x="709" y="166" width="447" height="490" rx="12" fill="#fff" stroke="#cbd4df" stroke-width="2"/><circle cx="365" cy="235" r="11" fill="#bd632b"/><text x="390" y="232" fill="#bd632b" font-family="Arial, sans-serif" font-size="23" font-weight="400">landmark</text><path d="M200 550 L365 235" fill="none" stroke="#2769ad" stroke-width="3" /><path d="M540 550 L365 235" fill="none" stroke="#237969" stroke-width="3" /><rect x="157" y="520" width="87" height="60" rx="12" fill="#e7eef8" stroke="#2769ad" stroke-width="2"/><rect x="497" y="520" width="87" height="60" rx="12" fill="#e0f1eb" stroke="#237969" stroke-width="2"/><circle cx="200" cy="547" r="14" fill="#2769ad"/><circle cx="540" cy="547" r="14" fill="#237969"/><text x="112" y="614" fill="#2769ad" font-family="Arial, sans-serif" font-size="22" font-weight="400">camera at t₁</text><text x="451" y="614" fill="#237969" font-family="Arial, sans-serif" font-size="22" font-weight="400">camera at t₂</text><path d="M246 555 L493 555" fill="none" stroke="#bd632b" stroke-width="3" /><path d="M-10 -5L0 0L-10 5" transform="translate(493 555) rotate(0)" fill="none" stroke="#bd632b" stroke-width="3"/><text x="280" y="590" fill="#bd632b" font-family="Arial, sans-serif" font-size="20" font-weight="400">translation</text><text x="76" y="307" fill="#2769ad" font-family="Arial, sans-serif" font-size="20" font-weight="400">ray from view 1</text><text x="459" y="350" fill="#237969" font-family="Arial, sans-serif" font-size="20" font-weight="400">ray from view 2</text><text x="736" y="209" fill="#182c45" font-family="Arial, sans-serif" font-size="20" font-weight="700">WHY MOVE SIDEWAYS?</text><text x="736" y="253" fill="#182c45" font-family="Arial, sans-serif" font-size="21" font-weight="400">The two rays constrain depth.</text><text x="736" y="289" fill="#182c45" font-family="Arial, sans-serif" font-size="21" font-weight="400">A rotation about the same</text><text x="736" y="321" fill="#182c45" font-family="Arial, sans-serif" font-size="21" font-weight="400">camera centre adds no baseline.</text><text x="736" y="393" fill="#182c45" font-family="Arial, sans-serif" font-size="20" font-weight="700">WHY IS SCALE UNKNOWN?</text><text x="736" y="438" fill="#182c45" font-family="Arial, sans-serif" font-size="21" font-weight="400">Double scene distances and</text><text x="736" y="470" fill="#182c45" font-family="Arial, sans-serif" font-size="21" font-weight="400">camera translation together:</text><text x="736" y="502" fill="#182c45" font-family="Arial, sans-serif" font-size="21" font-weight="400">the image directions stay the same.</text><text x="736" y="567" fill="#52647b" font-family="Arial, sans-serif" font-size="21" font-weight="400">A metric reference is extra</text><text x="736" y="599" fill="#52647b" font-family="Arial, sans-serif" font-size="21" font-weight="400">information, not a ROS setting.</text><text x="44" y="707" fill="#52647b" font-family="Arial, sans-serif" font-size="20" font-weight="400">Simplified geometry; calibrated rays, matches and sufficient parallax are all needed in practice.</text><text x="44" y="735" fill="#52647b" font-family="Arial, sans-serif" font-size="15" font-weight="400">Original course diagram • schematic, not measured output • CC BY 4.0</text></svg>