<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
<title id="title">Reuse the plumbing. Focus on the robot.</title><desc id="desc">Six reusable software capabilities surround a robot application: visualization, recording, simulation, navigation, manipulation and hardware integration. Shared interfaces let compatible Python and C++ nodes work on one or several computers.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#235c4b"/></marker></defs>
