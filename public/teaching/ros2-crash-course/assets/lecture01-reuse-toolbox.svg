font-size="27" font-weight="700" text-anchor="start">Visualize</text><text x="70" y="257" fill="#235c4b" font-size="24" font-weight="600" text-anchor="start">RViz</text><text x="70" y="298" fill="#6a7771" font-size="19" font-weight="400" text-anchor="start">Inspect live sensor data.</text><rect x="48" y="374" width="320" height="152" rx="16" fill="#fffefa" stroke="#dce1d7" stroke-width="2"/><text x="70" y="410" fill="#1b3634" font-size="27" font-weight="700" text-anchor="start">Record &amp; replay</text><text x="70" y="451" fill="#235c4b" font-size="24" font-weight="600" text-anchor="start">rosbag2</text><text x="70" y="492" fill="#6a7771" font-size="19" font-weight="400" text-anchor="start">Repeat an experiment.</text><rect x="48" y="568" width="320" height="152" rx="16" fill="#fffefa" stroke="#dce1d7" stroke-width="2"/><text x="70" y="604" fill="#1b3634" font-size="27" font-weight="700" text-anchor="start">Simulate</text><text x="70" y="645" fill="#235c4b" font-size="24" font-weight="600" text-anchor="start">Gazebo</text><text x="70" y="686" fill="#6a7771" font-size="19" font-weight="400" text-anchor="start">Model physics and sensors.</text><rect x="832" y="180" width="320" height="152" rx="16" fill="#fffefa" stroke="#dce1d7" stroke-width="2"/><text x="854" y="216" fill="#1b3634" font-size="27" font-weight="700" text-anchor="start">Navigate</text><text x="854" y="257" fill="#235c4b" font-size="24" font-weight="600" text-anchor="start">Nav2 + localization</text><text x="854" y="298" fill="#6a7771" font-size="19" font-weight="400" text-anchor="start">Plan and follow paths.</text><rect x="832" y="374" width="320" height="152" rx="16" fill="#fffefa" stroke="#dce1d7" stroke-width="2"/><text x="854" y="410" fill="#1b3634" font-size="27" font-weight="700" text-anchor="start">Move an arm</text><text x="854" y="451" fill="#235c4b" font-size="24" font-weight="600" text-anchor="start">MoveIt</text><text x="854" y="492" fill="#6a7771" font-size="19" font-weight="400" text-anchor="start">Plan manipulation motions.</text><rect x="832" y="568" width="320" height="152" rx="16" fill="#fffefa" stroke="#dce1d7" stroke-width="2"/><text x="854" y="604" fill="#1b3634" font-size="27" font-weight="700" text-anchor="start">Connect hardware</text><text x="854" y="645" fill="#235c4b" font-size="24" font-weight="600" text-anchor="start">Drivers + ros2_control</text><text x="854" y="686" fill="#6a7771" font-size="19" font-weight="400" text-anchor="start">Read sensors; command hardware.</text><rect x="48" y="754" width="1104" height="92" rx="16" fill="#eaf0e5" stroke="#dce1d7" stroke-width="2"/><text x="72" y="789" fill="#235c4b" font-size="23" font-weight="700" text-anchor="start">Shared interfaces</text><text x="72" y="820" fill="#6a7771" font-size="20" font-weight="400" text-anchor="start">Typed messages + conventions</text><text x="446" y="789" fill="#235c4b" font-size="23" font-weight="700" text-anchor="start">Python + C++</text><text x="446" y="820" fill="#6a7771" font-size="20" font-weight="400" text-anchor="start">Nodes can work together</text><text x="818" y="789" fill="#235c4b" font-size="23" font-weight="700" text-anchor="start">One or many computers</text><text x="818" y="820" fill="#6a7771" font-size="20" font-weight="400" text-anchor="start">Reachable, configured peers</text><text x="48" y="891" fill="#6a7771" font-size="22" font-weight="400" text-anchor="start">Select compatible packages; supply the robot model, drivers, configuration and hardware.</text>
