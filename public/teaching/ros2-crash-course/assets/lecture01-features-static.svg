<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc"><title id="title">From a package to a running ROS graph</title><desc id="desc">Package content can be started with run or coordinated with launch. Camera and viewer nodes exchange Image samples on a named topic; exposure belongs to the camera node. CLI, visualization and recordings inspect the running system.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#247b84"/></marker></defs><style>@media(prefers-reduced-motion:reduce){.packet{display:none}}</style><rect width="1200" height="1010" fill="#f4f7fa"/><text x="36" y="36" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#247b84">ROS 2 / FOLLOW THE DATA</text><text x="36" y="80" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#17344b">From a package to a running ROS graph</text><rect x="30" y="110" width="1140" height="235" rx="12" fill="#fff" stroke="#c5d4e0"/><text x="52" y="147" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#247b84">1  START PROGRAMS</text><rect x="52" y="173" width="310" height="141" rx="12" fill="#e7f4f3" stroke="#c5d4e0"/><text x="70" y="204" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#17344b">Package</text><text x="70" y="238" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#17344b">Installed executables</text><text x="70" y="267" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17344b">Launch files + configuration</text><text x="70" y="295" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#52677a">Source is built before use</text><rect x="446" y="173" width="310" height="141" rx="12" fill="#fff" stroke="#c5d4e0"/><text x="466" y="204" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#17344b">ros2 run</text><text x="466" y="238" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#17344b">Start one executable</text><text x="466" y="267" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#17344b">It may create several nodes</text><rect x="814" y="173" width="330" height="141" rx="12" fill="#fff" stroke="#c5d4e0"/><text x="834" y="204" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#17344b">ros2 launch</text><text x="834" y="238" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17344b">Coordinate several processes</text><text x="834" y="267" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#17344b">Pass parameters / remappings</text><path d="M362 242H436" fill="none" stroke="#247b84" stroke-width="3"  marker-end="url(#arrow)"/><path d="M362 280V330H980V320" fill="none" stroke="#247b84" stroke-width="3"  marker-end="url(#arrow)"/><text x="52" y="375" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52677a">run and launch are alternative entry points; launch is not the next step after run.</text><rect x="30" y="410" width="1140" height="360" rx="12" fill="#fff" stroke="#c5d4e0"/><text x="52" y="447" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#247b84">2  NODES EXCHANGE DATA</text><rect x="65" y="486" width="285" height="222" rx="12" fill="#e7f4f3" stroke="#c5d4e0"/><text x="86" y="526" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#17344b">/camera</text><text x="86" y="558" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#17344b">Node = running participant</text><rect x="86" y="585" width="242" height="94" rx="12" fill="#fff" stroke="#c5d4e0"/><text x="102" y="613" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17344b">Parameter: exposure</text><text x="102" y="641" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#17344b">Setting owned by this node</text><text x="102" y="663" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#52677a">Changes require support</text><rect x="865" y="486" width="267" height="222" rx="12" fill="#eaf0fc" stroke="#c5d4e0"/><text x="886" y="526" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#17344b">/viewer</text><text x="886" y="560" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#17344b">Node with a subscription</text><text x="886" y="610" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#17344b">Receives image messages</text><text x="886" y="647" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17344b">Displays their pixels</text><path d="M350 559H855" fill="none" stroke="#247b84" stroke-width="3"  marker-end="url(#arrow)"/><text x="403" y="511" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#247b84">Topic: /camera/image_raw</text><text x="420" y="602" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#17344b">Message = one typed sample</text><rect x="433" y="630" width="345" height="68" rx="12" fill="#fff6e9" stroke="#c5d4e0"/><text x="451" y="656" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#17344b">Image: stamp, frame, encoding,</text><text x="451" y="682" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#17344b">width, height, pixel data</text><rect x="30" y="800" width="1140" height="156" rx="12" fill="#fff" stroke="#c5d4e0"/><text x="52" y="836" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#247b84">3  INSPECT AND REPRODUCE</text><text x="52" y="876" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#17344b">ros2 node / topic / param</text><text x="52" y="909" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#17344b">Inspect participants, streams and settings</text><text x="536" y="876" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#17344b">RViz: visualize    rosbag2: record / replay</text><text x="536" y="909" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#17344b">Launch configuration: repeat the same startup</text><text x="36" y="986" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#52677a">Illustrative timing • original course diagram • CC BY 4.0 • static labels remain readable when paused</text></svg>