<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc"><title id="title">ROS belongs in user space — it is not the OS</title><desc id="desc">The running stack has hardware, a kernel that is part of the OS, OS user-space services, and applications. ROS client libraries and middleware are dependencies of robot applications. A separate boot path shows firmware and bootloader starting the kernel.</desc><defs><marker id="087f8c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087f8c"/></marker><marker id="2364c4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2364c4"/></marker><marker id="b95b27" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b95b27"/></marker><marker id="7953aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7953aa"/></marker><marker id="52677a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52677a"/></marker></defs><rect width="1400" height="860" fill="#f5f8fb"/><text x="48" y="45" fill="#087f8c" font-size="16" font-weight="700" font-family="Arial, sans-serif">LECTURE 01 / FOUNDATIONS</text><text x="48" y="95" fill="#152b3d" font-size="36" font-weight="700" font-family="Arial, sans-serif">ROS belongs in user space — it is not the OS</text><text x="62" y="144" fill="#52677a" font-size="18" font-weight="700" font-family="Arial, sans-serif">RUNNING SYSTEM: software depends on the layers below</text><rect x="48" y="166" width="890" height="295" rx="14" fill="#fff" stroke="#9fb9c9"/><rect x="69" y="184" width="190" height="31" rx="15" fill="#087f8c" stroke="#087f8c"/><text x="82" y="206" fill="#fff" font-size="15" font-weight="700" font-family="Arial, sans-serif">USER SPACE</text><text x="70" y="245" fill="#152b3d" font-size="27" font-weight="700" font-family="Arial, sans-serif">Robot application / ROS nodes</text><text x="70" y="275" fill="#52677a" font-size="20" font-weight="400" font-family="Arial, sans-serif">Your camera driver, planner, controller and tools</text><rect x="70" y="296" width="846" height="52" rx="7" fill="#e7f4f4" stroke="#c6e3e4"/><text x="88" y="330" fill="#087f8c" font-size="23" font-weight="700" font-family="Arial, sans-serif">ROS client libraries: rclpy / rclcpp</text><rect x="70" y="360" width="405" height="75" rx="7" fill="#edf1fc" stroke="#cbdaee"/><text x="88" y="393" fill="#2364c4" font-size="20" font-weight="700" font-family="Arial, sans-serif">ROS middleware interface</text><text x="88" y="421" fill="#2364c4" font-size="18" font-weight="400" font-family="Arial, sans-serif">rmw</text><rect x="493" y="360" width="423" height="75" rx="7" fill="#edf1fc" stroke="#cbdaee"/><text x="511" y="393" fill="#2364c4" font-size="20" font-weight="700" font-family="Arial, sans-serif">Selected implementation</text><text x="511" y="421" fill="#2364c4" font-size="18" font-weight="400" font-family="Arial, sans-serif">Fast DDS in this course</text><rect x="48" y="478" width="890" height="101" rx="14" fill="#e8edf2" stroke="#bdccd9"/><text x="70" y="516" fill="#152b3d" font-size="26" font-weight="700" font-family="Arial, sans-serif">OS libraries, services, shell and desktop</text><text x="70" y="553" fill="#52677a" font-size="20" font-weight="400" font-family="Arial, sans-serif">Ubuntu combines these with its kernel to form the operating system.</text><rect x="48" y="593" width="890" height="83" rx="14" fill="#dce5ef" stroke="#a9bdce"/><text x="70" y="629" fill="#152b3d" font-size="27" font-weight="700" font-family="Arial, sans-serif">Kernel + device drivers</text><text x="70" y="659" fill="#52677a" font-size="20" font-weight="400" font-family="Arial, sans-serif">Processes · memory · files · network · USB access</text><rect x="48" y="690" width="890" height="91" rx="14" fill="#253f53" stroke="#253f53"/><text x="70" y="728" fill="#fff" font-size="27" font-weight="700" font-family="Arial, sans-serif">Hardware</text><text x="70" y="761" fill="#d6e3ee" font-size="20" font-weight="400" font-family="Arial, sans-serif">CPU · RAM · storage · USB controller · network card · sensors</text><rect x="967" y="166" width="385" height="161" rx="14" fill="#fff" stroke="#d2dce5"/><text x="990" y="204" fill="#152b3d" font-size="22" font-weight="700" font-family="Arial, sans-serif">Also in user space</text><text x="990" y="243" fill="#152b3d" font-size="21" font-weight="400" font-family="Arial, sans-serif">Browser · VS Code · terminal</text><text x="990" y="280" fill="#52677a" font-size="19" font-weight="400" font-family="Arial, sans-serif">Same OS level; different jobs.</text><rect x="967" y="349" width="385" height="432" rx="14" fill="#fff8ee" stroke="#e4c7a6"/><rect x="990" y="371" width="190" height="31" rx="15" fill="#b95b27" stroke="#b95b27"/><text x="1003" y="393" fill="#fff" font-size="15" font-weight="700" font-family="Arial, sans-serif">BOOT PATH</text><text x="990" y="432" fill="#b95b27" font-size="25" font-weight="700" font-family="Arial, sans-serif">Power on</text><path d="M1135 451V479" fill="none" stroke="#b95b27" stroke-width="3"  marker-end="url(#b95b27)"/><text x="990" y="517" fill="#152b3d" font-size="24" font-weight="700" font-family="Arial, sans-serif">Firmware: UEFI / BIOS</text><text x="990" y="550" fill="#52677a" font-size="19" font-weight="400" font-family="Arial, sans-serif">Initialize hardware</text><path d="M1135 570V595" fill="none" stroke="#b95b27" stroke-width="3"  marker-end="url(#b95b27)"/><text x="990" y="634" fill="#152b3d" font-size="24" font-weight="700" font-family="Arial, sans-serif">Bootloader → kernel</text><text x="990" y="686" fill="#b95b27" font-size="21" font-weight="700" font-family="Arial, sans-serif">Firmware starts the OS.</text><text x="990" y="721" fill="#52677a" font-size="20" font-weight="400" font-family="Arial, sans-serif">ROS data does not pass</text><text x="990" y="750" fill="#52677a" font-size="20" font-weight="400" font-family="Arial, sans-serif">through BIOS as middleware.</text><text x="48" y="831" fill="#52677a" font-size="14" font-weight="400" font-family="Arial, sans-serif">ORIGINAL CONCEPT DIAGRAM · CC BY 4.0 · NODES TO MAPS</text></svg>