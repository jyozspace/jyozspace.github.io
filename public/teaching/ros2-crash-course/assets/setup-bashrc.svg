<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">A new Ubuntu terminal loads the saved settings</title><desc id="desc">Save the lesson’s .bashrc block, then open a fresh Ubuntu Bash terminal.. Illustrative simulation, not an actual software run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#4b7764"/></marker></defs><rect width="1000" height="640" fill="#f6f3e9"/><text x="34" y="38" font-size="15" fill="#8d4f31" font-family="Arial, sans-serif">VISUAL CHECKPOINT · SIMULATED EXAMPLE</text><text x="34" y="82" font-size="30" fill="#213e34" font-family="Arial, sans-serif">A new Ubuntu terminal loads the saved settings</text><rect x="34" y="108" width="932" height="449" rx="12" fill="#18332b" stroke="#18332b"/><text x="58" y="143" font-size="16" fill="#b9cbbb" font-family="Arial, sans-serif">Ubuntu · Bash — simulated screen</text><text x="58" y="184" font-size="17" fill="#b9d78f" font-family="monospace">$ printenv ROS_DISTRO RMW_IMPLEMENTATION \</text><text x="58" y="214" font-size="17" fill="#eef3e9" font-family="monospace">    ROS_AUTOMATIC_DISCOVERY_RANGE ROS_DOMAIN_ID</text><text x="58" y="244" font-size="17" fill="#eef3e9" font-family="monospace">jazzy</text><text x="58" y="274" font-size="17" fill="#eef3e9" font-family="monospace">rmw_fastrtps_cpp</text><text x="58" y="304" font-size="17" fill="#eef3e9" font-family="monospace">LOCALHOST</text><text x="58" y="334" font-size="17" fill="#eef3e9" font-family="monospace">42</text><text x="58" y="364" font-size="17" fill="#eef3e9" font-family="monospace"></text><text x="58" y="394" font-size="17" fill="#eef3e9" font-family="monospace">After the first build, new terminals also load the overlay.</text><text x="58" y="424" font-size="17" fill="#eef3e9" font-family="monospace">The .bashrc block sources ROS first, then your workspace.</text><text x="34" y="596" font-size="17" fill="#213e34" font-family="Arial, sans-serif">Save the lesson’s .bashrc block, then open a fresh Ubuntu Bash terminal.</text><text x="34" y="622" font-size="14" fill="#65766b" font-family="Arial, sans-serif">Illustrative values and layout. Compare concepts; your software may look different.</text></svg>