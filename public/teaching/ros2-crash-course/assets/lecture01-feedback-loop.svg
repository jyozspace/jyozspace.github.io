<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc"><title id="title">Sense → process → act → observe again</title><desc id="desc">A delivery robot observes wall distance and wheel speed. Measurements go to processing; a separate goal enters the controller. Motor commands change motion, which changes the next measurements.</desc><defs><marker id="087f8c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087f8c"/></marker><marker id="2364c4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2364c4"/></marker><marker id="b95b27" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b95b27"/></marker><marker id="7953aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7953aa"/></marker><marker id="52677a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52677a"/></marker></defs><rect width="1400" height="860" fill="#f5f8fb"/><text x="48" y="45" fill="#087f8c" font-size="16" font-weight="700" font-family="Arial, sans-serif">LECTURE 01 / FOUNDATIONS</text><text x="48" y="95" fill="#152b3d" font-size="36" font-weight="700" font-family="Arial, sans-serif">Sense → process → act → observe again</text><rect x="48" y="150" width="370" height="520" rx="14" fill="#fff" stroke="#d2dce5"/><rect x="70" y="170" width="190" height="31" rx="15" fill="#b95b27" stroke="#b95b27"/><text x="83" y="192" fill="#fff" font-size="15" font-weight="700" font-family="Arial, sans-serif">PHYSICAL WORLD</text><text x="70" y="237" fill="#152b3d" font-size="25" font-weight="700" font-family="Arial, sans-serif">Robot approaches a wall</text><path d="M88 535H370M343 288V535" stroke="#c4ced8" stroke-width="12"/>
 <path d="M343 300H361M343 338H361M343 376H361M343 414H361M343 452H361M343 490H361" stroke="#94a6b7" stroke-width="4"/>
 <rect x="102" y="428" width="168" height="73" rx="19" fill="#d9e9ef" stroke="#152b3d" stroke-width="3"/>
 <circle cx="135" cy="504" r="26" fill="#152b3d"/><circle cx="237" cy="504" r="26" fill="#152b3d"/>
 <circle cx="135" cy="504" r="9" fill="#b9c7d3"/><circle cx="237" cy="504" r="9" fill="#b9c7d3"/>
 <rect x="221" y="405" width="31" height="23" rx="4" fill="#087f8c"/>
 <path d="M251 414L339 365M251 414L339 463" stroke="#087f8c" stroke-width="2" stroke-dasharray="6 5" fill="none"/><text x="94" y="325" fill="#52677a" font-size="20" font-weight="400" font-family="Arial, sans-serif">Wall distance</text><text x="94" y="371" fill="#087f8c" font-size="34" font-weight="700" font-family="Arial, sans-serif">0.8 m</text><text x="74" y="585" fill="#152b3d" font-size="22" font-weight="400" font-family="Arial, sans-serif">Motion changes the next</text><text x="74" y="616" fill="#152b3d" font-size="22" font-weight="400" font-family="Arial, sans-serif">measurement.</text><rect x="505" y="150" width="355" height="180" rx="14" fill="#e8f5f5" stroke="#a8d5d8"/><rect x="528" y="171" width="190" height="31" rx="15" fill="#087f8c" stroke="#087f8c"/><text x="541" y="193" fill="#fff" font-size="15" font-weight="700" font-family="Arial, sans-serif">01 / SENSE</text><text x="528" y="229" fill="#152b3d" font-size="25" font-weight="700" font-family="Arial, sans-serif">Read measurements</text><text x="528" y="270" fill="#152b3d" font-size="21" font-weight="400" font-family="Arial, sans-serif">Distance sensor → clearance</text><text x="528" y="303" fill="#152b3d" font-size="21" font-weight="400" font-family="Arial, sans-serif">Wheel encoder → speed</text><rect x="947" y="150" width="405" height="180" rx="14" fill="#edf1fc" stroke="#b6c9ed"/><rect x="970" y="171" width="190" height="31" rx="15" fill="#2364c4" stroke="#2364c4"/><text x="983" y="193" fill="#fff" font-size="15" font-weight="700" font-family="Arial, sans-serif">02 / PROCESS</text><text x="970" y="229" fill="#152b3d" font-size="24" font-weight="700" font-family="Arial, sans-serif">Estimate, decide, control</text><text x="970" y="269" fill="#152b3d" font-size="20" font-weight="400" font-family="Arial, sans-serif">Compare goal with observation</text><text x="970" y="302" fill="#152b3d" font-size="21" font-weight="400" font-family="Arial, sans-serif">Compute the next command</text><rect x="947" y="470" width="405" height="200" rx="14" fill="#fff2e9" stroke="#e5bc9f"/><rect x="970" y="491" width="190" height="31" rx="15" fill="#b95b27" stroke="#b95b27"/><text x="983" y="513" fill="#fff" font-size="15" font-weight="700" font-family="Arial, sans-serif">03 / ACT</text><text x="970" y="549" fill="#152b3d" font-size="24" font-weight="700" font-family="Arial, sans-serif">Driver + motor + wheels</text><text x="970" y="590" fill="#152b3d" font-size="20" font-weight="400" font-family="Arial, sans-serif">Electrical power → wheel torque</text><text x="970" y="627" fill="#b95b27" font-size="23" font-weight="700" font-family="Arial, sans-serif">The robot slows down</text><path d="M418 239H500" fill="none" stroke="#087f8c" stroke-width="3"  marker-end="url(#087f8c)"/><path d="M860 239H942" fill="none" stroke="#087f8c" stroke-width="3"  marker-end="url(#087f8c)"/><path d="M1149 330V465" fill="none" stroke="#2364c4" stroke-width="3"  marker-end="url(#2364c4)"/><text x="1171" y="387" fill="#2364c4" font-size="19" font-weight="700" font-family="Arial, sans-serif">Command</text><path d="M947 574H423" fill="none" stroke="#b95b27" stroke-width="3"  marker-end="url(#b95b27)"/><text x="586" y="553" fill="#b95b27" font-size="22" font-weight="700" font-family="Arial, sans-serif">Physical effect</text><rect x="505" y="365" width="355" height="115" rx="14" fill="#f0ecf8" stroke="#c9b8df"/><text x="528" y="401" fill="#7953aa" font-size="23" font-weight="700" font-family="Arial, sans-serif">Goal / reference</text><text x="528" y="441" fill="#152b3d" font-size="21" font-weight="400" font-family="Arial, sans-serif">“Maintain a safe clearance”</text><path d="M860 421H903V300H942" fill="none" stroke="#7953aa" stroke-width="3"  marker-end="url(#7953aa)"/><rect x="48" y="712" width="1304" height="65" rx="14" fill="#e7eff5" stroke="#d2dce5"/><text x="72" y="751" fill="#152b3d" font-size="25" font-weight="700" font-family="Arial, sans-serif">Feedback means observing the effect of a command and adjusting the next one.</text><text x="48" y="831" fill="#52677a" font-size="14" font-weight="400" font-family="Arial, sans-serif">ORIGINAL CONCEPT DIAGRAM · CC BY 4.0 · NODES TO MAPS</text></svg>