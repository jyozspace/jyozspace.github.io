<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc">
<title id="title">DDS connects a distributed ROS graph</title><desc id="desc">Sensors, localization and planning share topic data with visualization, navigation/control and recording. The shared band is a conceptual data space, not a centralized server. Each process uses ROS client libraries, RMW, a DDS implementation and OS transport.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#235c4b"/></marker></defs>
<g font-family="Inter, Segoe UI, Arial, sans-serif"><rect width="1200" height="1060" fill="#f6f5f0"/>
<text x="48" y="43" fill="#b96d3f" font-size="16" font-weight="700" text-anchor="start">NODES TO MAPS  /  ROS 2 FOUNDATIONS</text>
<text x="48" y="102" fill="#1b3634" font-size="43" font-weight="700" text-anchor="start">DDS connects a distributed ROS graph</text>
<text x="48" y="140" fill="#6a7771" font-size="23" font-weight="400" text-anchor="start">DDS implementations discover endpoints and exchange compatible typed samples.</text><rect x="48" y="190" width="336" height="115" rx="16" fill="#fffefa" stroke="#dce1d7" stroke-width="2"/><text x="70" y="227" fill="#1b3634" font-size="25" font-weight="700" text-anchor="start">Sensor drivers</text><text x="70" y="282" fill="#6a7771" font-size="21" font-weight="400" text-anchor="start">Camera · lidar · IMU</text><path d="M216 305V370" fill="none" stroke="#235c4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="432" y="190" width="336" height="115" rx="16" fill="#fffefa" stroke="#dce1d7" stroke-width="2"/><text x="454" y="227" fill="#1b3634" font-size="25" font-weight="700" text-anchor="start">Localization</text><text x="454" y="282" fill="#6a7771" font-size="21" font-weight="400" text-anchor="start">Estimate the robot pose</text><path d="M600 305V370" fill="none" stroke="#235c4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="816" y="190" width="336" height="115" rx="16" fill="#fffefa" stroke="#dce1d7" stroke-width="2"/><text x="838" y="227" fill="#1b3634" font-size="25" font-weight="700" text-anchor="start">Planning</text><text x="838" y="282" fill="#6a7771" font-size="21" font-weight="400" text-anchor="start">Compute a route</text><path d="M984 305V370" fill="none" stroke="#235c4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="48" y="373" width="1104" height="163" rx="16" fill="#235c4b" stroke="#235c4b" stroke-width="2"/><text x="600" y="417" fill="#d4edab" font-size="22" font-weight="700" text-anchor="middle">SHARED TOPIC DATA SPACE</text><rect x="93" y="445" width="266" height="58" rx="10" fill="#fffefa" stroke="#fffefa" stroke-width="2"/><text x="226.0" y="482" fill="#235c4b" font-size="25" font-weight="600" text-anchor="middle">/camera/image_raw</text><rect x="387" y="445" width="174" height="58" rx="10" fill="#fffefa" stroke="#fffefa" stroke-width="2"/><text x="474.0" y="482" fill="#235c4b" font-size="25" font-weight="600" text-anchor="middle">/scan</text><rect x="589" y="445" width="150" height="58" rx="10" fill="#fffefa" stroke="#fffefa" stroke-width="2"/><text x="664.0" y="482" fill="#235c4b" font-size="25" font-weight="600" text-anchor="middle">/tf</text><rect x="767" y="445" width="338" height="58" rx="10" fill="#fffefa" stroke="#fffefa" stroke-width="2"/><text x="936.0" y="482" fill="#235c4b" font-size="25" font-weight="600" text-anchor="middle">/cmd_vel</text><path d="M216 536V600" fill="none" stroke="#235c4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="48" y="602" width="336" height="115" rx="16" fill="#fffefa" stroke="#dce1d7" stroke-width="2"/><text x="70" y="639" fill="#1b3634" font-size="25" font-weight="700" text-anchor="start">Visualization</text><text x="70" y="694" fill="#6a7771" font-size="21" font-weight="400" text-anchor="start">RViz inspects data</text><path d="M600 536V600" fill="none" stroke="#235c4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="432" y="602" width="336" height="115" rx="16" fill="#fffefa" stroke="#dce1d7" stroke-width="2"/><text x="454" y="639" fill="#1b3634" font-size="25" font-weight="700" text-anchor="start">Navigation &amp; control</text><text x="454" y="694" fill="#6a7771" font-size="21" font-weight="400" text-anchor="start">Follow a path; command motors</text><path d="M984 536V600" fill="none" stroke="#235c4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="816" y="602" width="336" height="115" rx="16" fill="#fffefa" stroke="#dce1d7" stroke-width="2"/><text x="838" y="639" fill="#1b3634" font-size="25" font-weight="700" text-anchor="start">Recording</text><text x="838" y="694" fill="#6a7771" font-size="21" font-weight="400" text-anchor="start">rosbag2 saves streams</text><text x="48" y="760" fill="#b96d3f" font-size="23" font-weight="600" text-anchor="start">The band groups logical data paths. It is not a central DDS server or a physical bus.</text><rect x="48" y="792" width="1104" height="158" rx="16" fill="#eaf0e5" stroke="#dce1d7" stroke-width="2"/><text x="72" y="830" fill="#235c4b" font-size="17" font-weight="700" text-anchor="start">INSIDE EACH ROS PROCESS</text><text x="72" y="868" fill="#1b3634" font-size="25" font-weight="600" text-anchor="start">Node → rclpy / rclcpp → RMW → DDS implementation → OS transport</text><text x="72" y="909" fill="#6a7771" font-size="22" font-weight="400" text-anchor="start">Discover peers first; then match topic names, types and QoS before exchanging data.</text><text x="48" y="990" fill="#6a7771" font-size="22" font-weight="400" text-anchor="start">Nodes can publish and subscribe. Arrows show example roles, not every connection.</text>
<path d="M48 1013H1152" fill="none" stroke="#dce1d7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="48" y="1041" fill="#6a7771" font-size="14" font-weight="400" text-anchor="start">CONCEPT DIAGRAM · CC BY 4.0 · NODES TO MAPS</text>
</g></svg>