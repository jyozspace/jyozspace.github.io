<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc"><title id="title">QoS asks two different questions</title><desc id="desc">A two by two reliability matrix shows reliable offers meet both requests, while best-effort offers cannot meet reliable requests. A separate sample strip shows finite keep-last history.</desc><rect width="1200" height="760" fill="#f5f7fa"/><text x="44" y="40" fill="#52647b" font-family="Arial, sans-serif" font-size="15" font-weight="700">NODES TO MAPS / CONCEPT EXPLAINER</text><text x="44" y="88" fill="#182c45" font-family="Arial, sans-serif" font-size="34" font-weight="700">QoS asks two different questions</text><text x="44" y="136" fill="#182c45" font-family="Arial, sans-serif" font-size="23" font-weight="400">Match the offered reliability against the requested reliability.</text><text x="430" y="188" fill="#52647b" font-family="Arial, sans-serif" font-size="17" font-weight="700">SUBSCRIBER REQUESTS</text><text x="454" y="228" fill="#182c45" font-family="Arial, sans-serif" font-size="24" font-weight="400">Reliable</text><text x="799" y="228" fill="#182c45" font-family="Arial, sans-serif" font-size="24" font-weight="400">Best effort</text><text x="44" y="299" fill="#52647b" font-family="Arial, sans-serif" font-size="15" font-weight="700">PUBLISHER OFFERS</text><text x="80" y="340" fill="#182c45" font-family="Arial, sans-serif" font-size="24" font-weight="400">Reliable</text><text x="80" y="439" fill="#182c45" font-family="Arial, sans-serif" font-size="24" font-weight="400">Best effort</text><rect x="365" y="264" width="333" height="82" rx="12" fill="#e0f1eb" stroke="#237969" stroke-width="2"/><text x="390" y="314" fill="#237969" font-family="Arial, sans-serif" font-size="25" font-weight="700">✓ Compatible</text><rect x="735" y="264" width="333" height="82" rx="12" fill="#e0f1eb" stroke="#237969" stroke-width="2"/><text x="760" y="314" fill="#237969" font-family="Arial, sans-serif" font-size="25" font-weight="700">✓ Compatible</text><rect x="365" y="364" width="333" height="82" rx="12" fill="#fbe6e8" stroke="#ac3b4a" stroke-width="2"/><text x="390" y="414" fill="#ac3b4a" font-family="Arial, sans-serif" font-size="25" font-weight="700">× Unmet request</text><rect x="735" y="364" width="333" height="82" rx="12" fill="#e0f1eb" stroke="#237969" stroke-width="2"/><text x="760" y="414" fill="#237969" font-family="Arial, sans-serif" font-size="25" font-weight="700">✓ Compatible</text><text x="44" y="500" fill="#182c45" font-family="Arial, sans-serif" font-size="24" font-weight="700">A separate decision: how much queued history to retain?</text><text x="44" y="538" fill="#52647b" font-family="Arial, sans-serif" font-size="20" font-weight="400">Keep-last depth 3, illustrated when four samples accumulate:</text><rect x="100" y="566" width="170" height="70" rx="12" fill="#fbe6e8" stroke="#cbd4df" stroke-width="2"/><text x="165" y="611" fill="#182c45" font-family="Arial, sans-serif" font-size="30" font-weight="700">7</text><rect x="340" y="566" width="170" height="70" rx="12" fill="#e0f1eb" stroke="#cbd4df" stroke-width="2"/><text x="405" y="611" fill="#182c45" font-family="Arial, sans-serif" font-size="30" font-weight="700">8</text><rect x="580" y="566" width="170" height="70" rx="12" fill="#e0f1eb" stroke="#cbd4df" stroke-width="2"/><text x="645" y="611" fill="#182c45" font-family="Arial, sans-serif" font-size="30" font-weight="700">9</text><rect x="820" y="566" width="170" height="70" rx="12" fill="#e0f1eb" stroke="#cbd4df" stroke-width="2"/><text x="885" y="611" fill="#182c45" font-family="Arial, sans-serif" font-size="30" font-weight="700">10</text><path d="M116 578 L253 624" fill="none" stroke="#ac3b4a" stroke-width="3" /><text x="94" y="669" fill="#ac3b4a" font-family="Arial, sans-serif" font-size="19" font-weight="400">oldest displaced</text><text x="422" y="669" fill="#237969" font-family="Arial, sans-serif" font-size="20" font-weight="400">three newer samples retained</text><text x="44" y="709" fill="#52647b" font-family="Arial, sans-serif" font-size="19" font-weight="400">All other QoS policies, types, names and transport must also be compatible.</text><text x="44" y="735" fill="#52647b" font-family="Arial, sans-serif" font-size="15" font-weight="400">Original course diagram • schematic, not measured output • CC BY 4.0</text></svg>