<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc"><title id="title">Ready work is different from running work</title><desc id="desc">Two timelines compare short callbacks with a long timer callback that delays a ready message callback on a single executor thread.</desc><rect width="1200" height="760" fill="#f5f7fa"/><text x="44" y="40" fill="#52647b" font-family="Arial, sans-serif" font-size="15" font-weight="700">NODES TO MAPS / CONCEPT EXPLAINER</text><text x="44" y="88" fill="#182c45" font-family="Arial, sans-serif" font-size="34" font-weight="700">Ready work is different from running work</text><text x="44" y="132" fill="#182c45" font-family="Arial, sans-serif" font-size="23" font-weight="400">One executor thread can run only one callback at a time.</text><rect x="44" y="163" width="1112" height="215" rx="12" fill="#fff" stroke="#cbd4df" stroke-width="2"/><text x="66" y="198" fill="#237969" font-family="Arial, sans-serif" font-size="17" font-weight="700">SHORT CALLBACKS</text><text x="66" y="246" fill="#52647b" font-family="Arial, sans-serif" font-size="19" font-weight="400">Ready events</text><text x="66" y="330" fill="#52647b" font-family="Arial, sans-serif" font-size="19" font-weight="400">Thread running</text><path d="M270 262 L1110 262" fill="none" stroke="#cbd4df" stroke-width="3" /><path d="M-10 -5L0 0L-10 5" transform="translate(1110 262) rotate(0)" fill="none" stroke="#cbd4df" stroke-width="3"/><path d="M270 345 L1110 345" fill="none" stroke="#cbd4df" stroke-width="3" /><path d="M-10 -5L0 0L-10 5" transform="translate(1110 345) rotate(0)" fill="none" stroke="#cbd4df" stroke-width="3"/><circle cx="320" cy="245" r="7" fill="#2769ad"/><text x="296" y="225" fill="#2769ad" font-family="Arial, sans-serif" font-size="18" font-weight="400">timer</text><path d="M320 269 L320 285" fill="none" stroke="#2769ad" stroke-width="3" stroke-dasharray="4 4"/><rect x="320" y="288" width="120" height="48" rx="12" fill="#2769ad" stroke="#2769ad" stroke-width="2"/><text x="334" y="319" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="400">timer</text><circle cx="580" cy="245" r="7" fill="#bd632b"/><text x="556" y="225" fill="#bd632b" font-family="Arial, sans-serif" font-size="18" font-weight="400">message</text><path d="M580 269 L580 285" fill="none" stroke="#bd632b" stroke-width="3" stroke-dasharray="4 4"/><rect x="580" y="288" width="120" height="48" rx="12" fill="#bd632b" stroke="#bd632b" stroke-width="2"/><text x="594" y="319" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="400">message</text><circle cx="840" cy="245" r="7" fill="#2769ad"/><text x="816" y="225" fill="#2769ad" font-family="Arial, sans-serif" font-size="18" font-weight="400">timer</text><path d="M840 269 L840 285" fill="none" stroke="#2769ad" stroke-width="3" stroke-dasharray="4 4"/><rect x="840" y="288" width="120" height="48" rx="12" fill="#2769ad" stroke="#2769ad" stroke-width="2"/><text x="854" y="319" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="400">timer</text><rect x="44" y="402" width="1112" height="265" rx="12" fill="#fff" stroke="#cbd4df" stroke-width="2"/><text x="66" y="438" fill="#ac3b4a" font-family="Arial, sans-serif" font-size="17" font-weight="700">A LONG CALLBACK</text><text x="66" y="488" fill="#52647b" font-family="Arial, sans-serif" font-size="19" font-weight="400">Ready events</text><path d="M270 505 L1110 505" fill="none" stroke="#cbd4df" stroke-width="3" /><path d="M-10 -5L0 0L-10 5" transform="translate(1110 505) rotate(0)" fill="none" stroke="#cbd4df" stroke-width="3"/><circle cx="320" cy="485" r="7" fill="#2769ad"/><text x="296" y="466" fill="#2769ad" font-family="Arial, sans-serif" font-size="18" font-weight="400">timer</text><circle cx="540" cy="485" r="7" fill="#bd632b"/><text x="508" y="466" fill="#bd632b" font-family="Arial, sans-serif" font-size="18" font-weight="400">message</text><text x="66" y="574" fill="#52647b" font-family="Arial, sans-serif" font-size="19" font-weight="400">Thread running</text><rect x="320" y="534" width="500" height="48" rx="12" fill="#2769ad" stroke="#2769ad" stroke-width="2"/><text x="340" y="565" fill="#fff" font-family="Arial, sans-serif" font-size="20" font-weight="400">timer callback still busy</text><rect x="840" y="534" width="210" height="48" rx="12" fill="#bd632b" stroke="#bd632b" stroke-width="2"/><text x="857" y="565" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="400">message callback</text><path d="M540 512 L840 512" fill="none" stroke="#bd632b" stroke-width="3" /><path d="M-10 -5L0 0L-10 5" transform="translate(840 512) rotate(0)" fill="none" stroke="#bd632b" stroke-width="3"/><text x="545" y="627" fill="#52647b" font-family="Arial, sans-serif" font-size="19" font-weight="400">Message ready here; callback starts only after the timer returns.</text><text x="44" y="707" fill="#52647b" font-family="Arial, sans-serif" font-size="19" font-weight="400">Horizontal position shows illustrative time; callback order is not a general scheduling guarantee.</text><text x="44" y="735" fill="#52647b" font-family="Arial, sans-serif" font-size="15" font-weight="400">Original course diagram • schematic, not measured output • CC BY 4.0</text></svg>