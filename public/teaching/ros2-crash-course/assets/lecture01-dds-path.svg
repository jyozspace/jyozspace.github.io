<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc"><title id="title">ROS names the conversation; middleware moves the data</title><desc id="desc">A camera publishes one image topic to a viewer and detector. The software path goes from a node through a client library and RMW to Fast DDS and operating system transport. Discovery and compatible data delivery are distinct checks.</desc><defs><marker id="087f8c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087f8c"/></marker><marker id="2364c4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2364c4"/></marker><marker id="b95b27" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b95b27"/></marker><marker id="7953aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7953aa"/></marker><marker id="52677a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52677a"/></marker></defs><rect width="1400" height="860" fill="#f5f8fb"/><text x="48" y="45" fill="#087f8c" font-size="16" font-weight="700" font-family="Arial, sans-serif">LECTURE 01 / FOUNDATIONS</text><text x="48" y="95" fill="#152b3d" font-size="36" font-weight="700" font-family="Arial, sans-serif">ROS names the conversation; middleware moves the data</text><rect x="48" y="156" width="1304" height="294" rx="14" fill="#fff" stroke="#d2dce5"/><rect x="70" y="174" width="190" height="31" rx="15" fill="#087f8c" stroke="#087f8c"/><text x="83" y="196" fill="#fff" font-size="15" font-weight="700" font-family="Arial, sans-serif">ROS GRAPH</text><rect x="85" y="247" width="282" height="118" rx="14" fill="#e7f4f4" stroke="#abd0d1"/><text x="109" y="284" fill="#152b3d" font-size="27" font-weight="700" font-family="Arial, sans-serif">Camera node</text><text x="109" y="322" fill="#087f8c" font-size="21" font-weight="400" font-family="Arial, sans-serif">publisher</text><rect x="899" y="203" width="389" height="92" rx="14" fill="#edf1fc" stroke="#b5c8e7"/><text x="924" y="240" fill="#152b3d" font-size="25" font-weight="700" font-family="Arial, sans-serif">Viewer node</text><text x="924" y="273" fill="#2364c4" font-size="20" font-weight="400" font-family="Arial, sans-serif">subscription → display pixels</text><rect x="899" y="324" width="389" height="92" rx="14" fill="#edf1fc" stroke="#b5c8e7"/><text x="924" y="361" fill="#152b3d" font-size="25" font-weight="700" font-family="Arial, sans-serif">Detector node</text><text x="924" y="394" fill="#2364c4" font-size="20" font-weight="400" font-family="Arial, sans-serif">subscription → find objects</text><path d="M367 307H750V249H894" fill="none" stroke="#087f8c" stroke-width="3"  marker-end="url(#087f8c)"/><path d="M750 307V370H894" fill="none" stroke="#087f8c" stroke-width="3"  marker-end="url(#087f8c)"/><text x="407" y="272" fill="#087f8c" font-size="24" font-weight="700" font-family="Arial, sans-serif">/camera/image_raw</text><text x="407" y="342" fill="#52677a" font-size="21" font-weight="400" font-family="Arial, sans-serif">sensor_msgs/msg/Image</text><text x="407" y="379" fill="#52677a" font-size="20" font-weight="400" font-family="Arial, sans-serif">One typed stream, two consumers</text><rect x="48" y="472" width="630" height="284" rx="14" fill="#f0f4f8" stroke="#d2dce5"/><text x="72" y="512" fill="#152b3d" font-size="24" font-weight="700" font-family="Arial, sans-serif">Software path inside each process</text><text x="72" y="554" fill="#152b3d" font-size="23" font-weight="400" font-family="Arial, sans-serif">Your node → rclpy / rclcpp → rmw</text><path d="M347 572V599" fill="none" stroke="#2364c4" stroke-width="3"  marker-end="url(#2364c4)"/><text x="72" y="636" fill="#2364c4" font-size="25" font-weight="700" font-family="Arial, sans-serif">Fast DDS implementation</text><text x="72" y="677" fill="#52677a" font-size="21" font-weight="400" font-family="Arial, sans-serif">OS networking or suitable local transport</text><text x="72" y="719" fill="#52677a" font-size="21" font-weight="400" font-family="Arial, sans-serif">The application usually calls ROS APIs.</text><rect x="700" y="472" width="652" height="284" rx="14" fill="#fff" stroke="#d2dce5"/><text x="724" y="514" fill="#152b3d" font-size="25" font-weight="700" font-family="Arial, sans-serif">Two checks, not one</text><text x="724" y="560" fill="#087f8c" font-size="24" font-weight="700" font-family="Arial, sans-serif">1  Discovery</text><text x="749" y="595" fill="#152b3d" font-size="21" font-weight="400" font-family="Arial, sans-serif">Can participants find one another?</text><text x="724" y="645" fill="#2364c4" font-size="24" font-weight="700" font-family="Arial, sans-serif">2  Data delivery</text><text x="749" y="681" fill="#152b3d" font-size="20" font-weight="400" font-family="Arial, sans-serif">Do names, types, QoS and transport match?</text><text x="724" y="730" fill="#b95b27" font-size="20" font-weight="700" font-family="Arial, sans-serif">A listed topic can still have a silent subscriber.</text><text x="48" y="831" fill="#52677a" font-size="14" font-weight="400" font-family="Arial, sans-serif">ORIGINAL CONCEPT DIAGRAM · CC BY 4.0 · NODES TO MAPS</text></svg>