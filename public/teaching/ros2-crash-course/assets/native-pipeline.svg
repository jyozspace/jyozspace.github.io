<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">From Android sensors to ROS and a map</title><desc id="desc">Native acquisition improves observability; camera–IMU fusion needs additional calibration.. Illustrative simulation, not an actual software run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#4b7764"/></marker></defs><rect width="1000" height="640" fill="#f6f3e9"/><text x="34" y="38" font-size="15" fill="#8d4f31" font-family="Arial, sans-serif">VISUAL CHECKPOINT · SIMULATED EXAMPLE</text><text x="34" y="82" font-size="30" fill="#213e34" font-family="Arial, sans-serif">From Android sensors to ROS and a map</text><rect x="40" y="129" width="280" height="94" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="58" y="165" font-size="22" fill="#213e34" font-family="Arial, sans-serif">Android Camera2</text><text x="58" y="197" font-size="16" fill="#557064" font-family="Arial, sans-serif">Fixed camera ID + native image</text><rect x="40" y="264" width="280" height="94" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="58" y="300" font-size="22" fill="#213e34" font-family="Arial, sans-serif">SensorManager</text><text x="58" y="332" font-size="16" fill="#557064" font-family="Arial, sans-serif">Independent accel + gyro events</text><path d="M327 178L433 235" stroke="#4b7764" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M327 311L433 254" stroke="#4b7764" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="341" y="333" font-size="18" fill="#213e34" font-family="Arial, sans-serif">WSS</text><text x="338" y="365" font-size="15" fill="#213e34" font-family="Arial, sans-serif">Wi-Fi / USB</text><rect x="446" y="196" width="515" height="94" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="464" y="232" font-size="22" fill="#213e34" font-family="Arial, sans-serif">phone_bridge · Ubuntu / WSL</text><text x="464" y="264" font-size="16" fill="#557064" font-family="Arial, sans-serif">Pin + token → clock → validate → publish</text><path d="M701 296L701 339" stroke="#4b7764" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="446" y="351" width="515" height="94" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="464" y="387" font-size="22" fill="#213e34" font-family="Arial, sans-serif">ROS camera + motion topics</text><text x="464" y="419" font-size="16" fill="#557064" font-family="Arial, sans-serif">Separate inertial event times are preserved</text><path d="M701 451L701 482" stroke="#4b7764" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="446" y="488" width="515" height="94" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="464" y="524" font-size="22" fill="#213e34" font-family="Arial, sans-serif">Monocular ORB-SLAM3 adapter</text><text x="464" y="556" font-size="16" fill="#557064" font-family="Arial, sans-serif">Images + measured settings → sparse map</text><text x="45" y="454" font-size="19" fill="#213e34" font-family="Arial, sans-serif">Native camera time: REALTIME</text><text x="45" y="490" font-size="18" fill="#213e34" font-family="Arial, sans-serif">or labelled callback fallback.</text><text x="45" y="535" font-size="19" fill="#213e34" font-family="Arial, sans-serif">Motion time: SensorEvent.</text><text x="34" y="596" font-size="17" fill="#213e34" font-family="Arial, sans-serif">Native acquisition improves observability; camera–IMU fusion needs additional calibration.</text><text x="34" y="622" font-size="14" fill="#65766b" font-family="Arial, sans-serif">Illustrative values and layout. Compare concepts; your software may look different.</text></svg>