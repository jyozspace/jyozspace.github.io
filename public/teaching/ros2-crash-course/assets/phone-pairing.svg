<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Pair first, then inspect the stream</title><desc id="desc">Example counters and RTT are illustrative; use your own measurements as evidence.. Illustrative simulation, not an actual software run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#4b7764"/></marker></defs><rect width="1000" height="640" fill="#f6f3e9"/><text x="34" y="38" font-size="15" fill="#8d4f31" font-family="Arial, sans-serif">VISUAL CHECKPOINT · SIMULATED EXAMPLE</text><text x="34" y="82" font-size="30" fill="#213e34" font-family="Arial, sans-serif">Pair first, then inspect the stream</text><rect x="40" y="112" width="320" height="445" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="64" y="148" font-size="25" fill="#213e34" font-family="Arial, sans-serif">Android sensor app</text><text x="64" y="188" font-size="17" fill="#213e34" font-family="Arial, sans-serif">WSS: laptop /ws/android</text><rect x="62" y="207" width="275" height="43" rx="12" fill="#edf2e9" stroke="#cbd5c8"/><text x="73" y="235" font-size="16" fill="#213e34" font-family="Arial, sans-serif">Token: enter from laptop</text><rect x="62" y="266" width="275" height="115" rx="12" fill="#dae6d3" stroke="#cbd5c8"/><text x="84" y="321" font-size="24" fill="#213e34" font-family="Arial, sans-serif">Camera preview</text><text x="84" y="350" font-size="16" fill="#213e34" font-family="Arial, sans-serif">Your scene appears here</text><text x="64" y="419" font-size="18" fill="#213e34" font-family="Arial, sans-serif">Frames: 120  Motion: 580</text><text x="64" y="450" font-size="17" fill="#213e34" font-family="Arial, sans-serif">Estimated clock: RTT 12 ms</text><text x="64" y="483" font-size="17" fill="#213e34" font-family="Arial, sans-serif">Stop releases the sensors</text><rect x="452" y="127" width="506" height="94" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="470" y="163" font-size="22" fill="#213e34" font-family="Arial, sans-serif">Laptop HTTPS / WSS receiver</text><text x="470" y="195" font-size="16" fill="#557064" font-family="Arial, sans-serif">Pairing token printed in its terminal</text><path d="M365 305L440 305" stroke="#4b7764" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="465" y="290" font-size="20" fill="#213e34" font-family="Arial, sans-serif">After pairing, run:</text><text x="465" y="332" font-size="19" fill="#213e34" font-family="monospace">ros2 node list</text><text x="465" y="372" font-size="20" fill="#213e34" font-family="Arial, sans-serif">Expect: /phone_bridge</text><text x="465" y="423" font-size="18" fill="#213e34" font-family="monospace">ros2 topic hz</text><text x="465" y="454" font-size="18" fill="#213e34" font-family="monospace">/phone/camera/image_raw</text><text x="465" y="505" font-size="16" fill="#213e34" font-family="Arial, sans-serif">Counters indicate app sends; ROS confirms receipt.</text><text x="34" y="596" font-size="17" fill="#213e34" font-family="Arial, sans-serif">Example counters and RTT are illustrative; use your own measurements as evidence.</text><text x="34" y="622" font-size="14" fill="#65766b" font-family="Arial, sans-serif">Illustrative values and layout. Compare concepts; your software may look different.</text></svg>