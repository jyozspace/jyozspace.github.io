<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">One clock conversion, two sensor streams</title><desc id="desc">A small RTT helps estimate clock offset; camera capture timing needs its own evidence.. Illustrative simulation, not an actual software run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#4b7764"/></marker></defs><rect width="1000" height="640" fill="#f6f3e9"/><text x="34" y="38" font-size="15" fill="#8d4f31" font-family="Arial, sans-serif">VISUAL CHECKPOINT · SIMULATED EXAMPLE</text><text x="34" y="82" font-size="30" fill="#213e34" font-family="Arial, sans-serif">One clock conversion, two sensor streams</text><text x="52" y="145" font-size="24" fill="#213e34" font-family="Arial, sans-serif">Phone: monotonic time</text><text x="610" y="145" font-size="24" fill="#213e34" font-family="Arial, sans-serif">Laptop: ROS wall time</text><path d="M150 170V499 M830 170V499" stroke="#9bada0" stroke-width="3"/><path d="M159 200L820 285" stroke="#4b7764" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="278" y="211" font-size="20" fill="#213e34" font-family="Arial, sans-serif">request at phone time t0</text><path d="M820 315L159 400" stroke="#4b7764" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="295" y="366" font-size="20" fill="#213e34" font-family="Arial, sans-serif">reply includes server time</text><text x="55" y="473" font-size="22" fill="#213e34" font-family="Arial, sans-serif">RTT = t1 − t0</text><text x="55" y="517" font-size="22" fill="#213e34" font-family="Arial, sans-serif">offset ≈ server_time − (t0 + t1) / 2</text><text x="55" y="555" font-size="21" fill="#213e34" font-family="Arial, sans-serif">converted_stamp ≈ phone_sample_time + offset</text><text x="34" y="596" font-size="17" fill="#213e34" font-family="Arial, sans-serif">A small RTT helps estimate clock offset; camera capture timing needs its own evidence.</text><text x="34" y="622" font-size="14" fill="#65766b" font-family="Arial, sans-serif">Illustrative values and layout. Compare concepts; your software may look different.</text></svg>