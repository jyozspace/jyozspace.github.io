<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc"><title id="title">Commands and observations travel on different topics</title><desc id="desc">The keyboard teleop node publishes Twist on turtle1/cmd_vel to turtlesim. The simulator publishes Pose on turtle1/pose to inspection tools. An automatic controller would read pose and compute velocity, closing the feedback loop.</desc><defs><marker id="087f8c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087f8c"/></marker><marker id="2364c4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2364c4"/></marker><marker id="b95b27" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b95b27"/></marker><marker id="7953aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7953aa"/></marker><marker id="52677a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52677a"/></marker></defs><rect width="1400" height="860" fill="#f5f8fb"/><text x="48" y="45" fill="#087f8c" font-size="16" font-weight="700" font-family="Arial, sans-serif">LECTURE 01 / FOUNDATIONS</text><text x="48" y="95" fill="#152b3d" font-size="36" font-weight="700" font-family="Arial, sans-serif">Commands and observations travel on different topics</text><rect x="48" y="160" width="1304" height="570" rx="14" fill="#fff" stroke="#d2dce5"/><rect x="73" y="181" width="190" height="31" rx="15" fill="#087f8c" stroke="#087f8c"/><text x="86" y="203" fill="#fff" font-size="15" font-weight="700" font-family="Arial, sans-serif">LIVE COMPONENTS</text><rect x="80" y="285" width="320" height="145" rx="14" fill="#e7f4f4" stroke="#a9ced1"/><text x="104" y="326" fill="#152b3d" font-size="27" font-weight="700" font-family="Arial, sans-serif">/teleop_turtle</text><text x="104" y="366" fill="#087f8c" font-size="23" font-weight="400" font-family="Arial, sans-serif">Keyboard → velocity</text><text x="104" y="404" fill="#52677a" font-size="19" font-weight="400" font-family="Arial, sans-serif">Terminal B</text><rect x="969" y="285" width="326" height="145" rx="14" fill="#edf1fc" stroke="#b6c8e5"/><text x="993" y="326" fill="#152b3d" font-size="27" font-weight="700" font-family="Arial, sans-serif">/turtlesim</text><text x="993" y="366" fill="#2364c4" font-size="20" font-weight="400" font-family="Arial, sans-serif">Velocity → simulated pose</text><text x="993" y="404" fill="#52677a" font-size="19" font-weight="400" font-family="Arial, sans-serif">Terminal A + turtle window</text><path d="M400 330H964" fill="none" stroke="#087f8c" stroke-width="3"  marker-end="url(#087f8c)"/><text x="453" y="284" fill="#087f8c" font-size="25" font-weight="700" font-family="Arial, sans-serif">/turtle1/cmd_vel</text><text x="453" y="366" fill="#52677a" font-size="21" font-weight="400" font-family="Arial, sans-serif">geometry_msgs/msg/Twist</text><rect x="80" y="521" width="320" height="145" rx="14" fill="#fff5eb" stroke="#e4c1a5"/><text x="104" y="560" fill="#152b3d" font-size="26" font-weight="700" font-family="Arial, sans-serif">Inspection tools</text><text x="104" y="601" fill="#b95b27" font-size="22" font-weight="400" font-family="Arial, sans-serif">echo / hz / visualizer</text><text x="104" y="640" fill="#52677a" font-size="19" font-weight="400" font-family="Arial, sans-serif">Terminal C</text><path d="M1132 430V589H405" fill="none" stroke="#2364c4" stroke-width="3"  marker-end="url(#2364c4)"/><text x="527" y="545" fill="#2364c4" font-size="25" font-weight="700" font-family="Arial, sans-serif">/turtle1/pose</text><text x="527" y="626" fill="#52677a" font-size="21" font-weight="400" font-family="Arial, sans-serif">turtlesim/msg/Pose</text><text x="80" y="242" fill="#087f8c" font-size="17" font-weight="700" font-family="Arial, sans-serif">COMMAND PATH</text><text x="80" y="488" fill="#2364c4" font-size="17" font-weight="700" font-family="Arial, sans-serif">OBSERVATION PATH</text><rect x="48" y="751" width="1304" height="40" rx="8" fill="#e7eff5" stroke="#d2dce5"/><text x="69" y="779" fill="#152b3d" font-size="23" font-weight="700" font-family="Arial, sans-serif">To automate control: replace the keyboard node with one that reads pose and computes velocity.</text><text x="48" y="831" fill="#52677a" font-size="14" font-weight="400" font-family="Arial, sans-serif">ORIGINAL CONCEPT DIAGRAM · CC BY 4.0 · NODES TO MAPS</text></svg>