<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">The moving turtle and its command path</title><desc id="desc">A moving turtle plus matching graph endpoints explains which connection worked.. Illustrative simulation, not an actual software run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#4b7764"/></marker></defs><rect width="1000" height="640" fill="#f6f3e9"/><text x="34" y="38" font-size="15" fill="#8d4f31" font-family="Arial, sans-serif">VISUAL CHECKPOINT · SIMULATED EXAMPLE</text><text x="34" y="82" font-size="30" fill="#213e34" font-family="Arial, sans-serif">The moving turtle and its command path</text><rect x="34" y="112" width="402" height="420" rx="12" fill="#eaf4f8" stroke="#cbd5c8"/><text x="55" y="148" font-size="21" fill="#213e34" font-family="Arial, sans-serif">turtlesim</text><path d="M135 392 C70 230 340 205 330 370" fill="none" stroke="#b97b52" stroke-width="5"/><ellipse cx="330" cy="370" rx="25" ry="20" fill="#4b7764"/><circle cx="351" cy="363" r="10" fill="#7b9f78"/><rect x="478" y="165" width="212" height="94" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="496" y="201" font-size="22" fill="#213e34" font-family="Arial, sans-serif">/teleop_turtle</text><text x="496" y="233" font-size="16" fill="#557064" font-family="Arial, sans-serif">keyboard publisher</text><rect x="744" y="165" width="222" height="94" rx="12" fill="#fff" stroke="#cbd5c8"/><text x="762" y="201" font-size="22" fill="#213e34" font-family="Arial, sans-serif">/turtlesim</text><text x="762" y="233" font-size="16" fill="#557064" font-family="Arial, sans-serif">command subscriber</text><path d="M691 211L740 211" stroke="#4b7764" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="478" y="302" font-size="20" fill="#213e34" font-family="Arial, sans-serif">Topic: /turtle1/cmd_vel</text><text x="478" y="338" font-size="18" fill="#213e34" font-family="Arial, sans-serif">Type: geometry_msgs/msg/Twist</text><text x="478" y="397" font-size="20" fill="#213e34" font-family="Arial, sans-serif">Focus the teleop terminal,</text><text x="478" y="427" font-size="20" fill="#213e34" font-family="Arial, sans-serif">then press an arrow key.</text><text x="478" y="480" font-size="17" fill="#213e34" font-family="Arial, sans-serif">rqt_graph shows the connection.</text><text x="34" y="596" font-size="17" fill="#213e34" font-family="Arial, sans-serif">A moving turtle plus matching graph endpoints explains which connection worked.</text><text x="34" y="622" font-size="14" fill="#65766b" font-family="Arial, sans-serif">Illustrative values and layout. Compare concepts; your software may look different.</text></svg>